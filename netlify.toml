[build]
  command = "python3 -m pip install -e ./backend && python3 scripts/prepare_static_site.py"
  publish = "frontend"
  # Netlify ignore commands return 0 to skip a build and 1 to continue.
  # Development PRs validate in GitHub. The already-created 2014 beta preview
  # remains frozen until a deliberate batched preview refresh is requested.
  ignore = 'test "$CONTEXT" != "production"'
