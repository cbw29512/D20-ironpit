[build]
  command = "python3 scripts/write_frontend_config.py"
  publish = "frontend"
  # Netlify ignore commands return 0 to skip a build and 1 to continue.
  # Only the production deploy context is allowed to consume Netlify build credits.
  ignore = 'test "$CONTEXT" != "production"'

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://iron-pit-d20-api.onrender.com; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'"
