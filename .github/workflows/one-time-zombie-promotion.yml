name: One-time Zombie promotion

on:
  push:
    paths:
      - .github/workflows/one-time-zombie-promotion.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Add zombie catalog and figure candidates
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog = Path('backend/app/content/monster_catalog.py')
          text = catalog.read_text(encoding='utf-8')
          old = '"Mastiff": "srd-mastiff", "Mule": "srd-mule", "Noble": "srd-noble", "Ogre": "srd-ogre", "Owl": "srd-owl",'
          new = '"Mastiff": "srd-mastiff", "Mule": "srd-mule", "Noble": "srd-noble", "Ogre": "srd-ogre", "Ogre Zombie": "srd-ogre-zombie", "Owl": "srd-owl",'
          if old not in text:
              raise SystemExit('Ogre catalog insertion point drifted.')
          text = text.replace(old, new, 1)
          old = '"Venomous Snake": "srd-venomous-snake", "Violet Fungus": "srd-violet-fungus",'
          new = '"Venomous Snake": "srd-venomous-snake", "Violet Fungus": "srd-violet-fungus", "Zombie": "srd-zombie",'
          if old not in text:
              raise SystemExit('Zombie catalog insertion point drifted.')
          catalog.write_text(text.replace(old, new, 1), encoding='utf-8')

          figures = Path('backend/app/content/figure_profiles.py')
          text = figures.read_text(encoding='utf-8')
          old = '    "Ogre": _p("brute", "ogre"),\n'
          new = old + '    "Ogre Zombie": _p("brute", "ogre-zombie"),\n'
          if old not in text:
              raise SystemExit('Ogre figure insertion point drifted.')
          text = text.replace(old, new, 1)
          old = '    "Wolf": _p("quadruped", "canine"),\n'
          new = old + '    "Zombie": _p("humanoid", "zombie"),\n'
          if old not in text:
              raise SystemExit('Zombie figure insertion point drifted.')
          figures.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Update durable zombie promotion contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in (
              'backend/tests/test_figure_profiles.py',
              'backend/tests/test_full_content_catalog.py',
              'backend/tests/test_monster_source_audit.py',
          ):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count('== 101') != 1:
                  raise SystemExit(f'Expected one 101-monster contract in {filename}.')
              path.write_text(text.replace('== 101', '== 103', 1), encoding='utf-8')

          catalog_test = Path('backend/tests/test_full_content_catalog.py')
          text = catalog_test.read_text(encoding='utf-8')
          old = '"Mule": "srd-mule", "Noble": "srd-noble", "Ogre": "srd-ogre", "Owl": "srd-owl", "Owlbear": "srd-owlbear",'
          new = '"Mule": "srd-mule", "Noble": "srd-noble", "Ogre": "srd-ogre", "Ogre Zombie": "srd-ogre-zombie", "Owl": "srd-owl", "Owlbear": "srd-owlbear",'
          if old not in text:
              raise SystemExit('Ogre Zombie full-catalog mapping insertion point drifted.')
          text = text.replace(old, new, 1)
          old = '"Weasel": "srd-weasel", "Wolf": "srd-wolf",'
          new = '"Weasel": "srd-weasel", "Wolf": "srd-wolf", "Zombie": "srd-zombie",'
          if old not in text:
              raise SystemExit('Zombie full-catalog mapping insertion point drifted.')
          catalog_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          roster = Path('backend/tests/test_arena_roster.py')
          text = roster.read_text(encoding='utf-8')
          old = '"srd-killer-whale", "srd-manticore", "srd-pegasus"'
          new = '"srd-killer-whale", "srd-manticore", "srd-ogre-zombie", "srd-pegasus"'
          if old not in text:
              raise SystemExit('Ogre Zombie roster insertion point drifted.')
          text = text.replace(old, new, 1)
          old = '"srd-tough", "srd-venomous-snake", "srd-violet-fungus",'
          new = '"srd-tough", "srd-venomous-snake", "srd-violet-fungus", "srd-zombie",'
          if old not in text:
              raise SystemExit('Zombie roster insertion point drifted.')
          roster.write_text(text.replace(old, new, 1), encoding='utf-8')

          readiness = Path('backend/tests/test_public_readiness.py')
          text = readiness.read_text(encoding='utf-8')
          marker = 'def test_legacy_uncertified_hero_cannot_bypass_catalog_through_api_id() -> None:\n'
          addition = (
              '@pytest.mark.parametrize("monster_id", ["srd-zombie", "srd-ogre-zombie"])\n'
              'def test_certified_zombies_pass_public_readiness(monster_id: str) -> None:\n'
              '    assert_public_selection_runnable(_selection("karnok-stoneward-l1", monster_id))\n\n\n'
          )
          if marker not in text:
              raise SystemExit('Public readiness insertion point drifted.')
          text = text.replace(marker, addition + marker, 1)
          if text.count('"srd-zombie"') != 3:
              raise SystemExit('Unexpected Zombie readiness references before rejection update.')
          old = 'with pytest.raises(ValueError, match="srd-zombie"):\n        assert_public_selection_runnable(_selection("karnok-stoneward-l1", "srd-zombie"))'
          new = 'with pytest.raises(ValueError, match="srd-specter"):\n        assert_public_selection_runnable(_selection("karnok-stoneward-l1", "srd-specter"))'
          if old not in text:
              raise SystemExit('Uncertified monster readiness contract drifted.')
          readiness.write_text(text.replace(old, new, 1), encoding='utf-8')

          browser = Path('frontend/browser-generated-monsters.test.cjs')
          text = browser.read_text(encoding='utf-8')
          old = 'assert.equal(Object.keys(generated).length, 101, "Generated runtime must expose only currently RAW-certified monsters");'
          new = 'assert.equal(Object.keys(generated).length, 103, "Generated runtime must expose only currently RAW-certified monsters");'
          if old not in text:
              raise SystemExit('Generated browser monster-count contract drifted.')
          text = text.replace(old, new, 1)
          old = '"srd-killer-whale", "srd-manticore", "srd-pegasus", "srd-scorpion", "srd-skeleton", "srd-spider",'
          new = '"srd-killer-whale", "srd-manticore", "srd-ogre-zombie", "srd-pegasus", "srd-scorpion", "srd-skeleton", "srd-spider",'
          if old not in text:
              raise SystemExit('Ogre Zombie browser presence insertion point drifted.')
          text = text.replace(old, new, 1)
          old = '"srd-swarm-of-insects", "srd-swarm-of-venomous-snakes",\n]) {'
          new = '"srd-swarm-of-insects", "srd-swarm-of-venomous-snakes", "srd-zombie",\n]) {'
          if old not in text:
              raise SystemExit('Zombie browser presence insertion point drifted.')
          text = text.replace(old, new, 1)
          text = text.replace('Generated monster runtime contains 101 RAW-certified templates', 'Generated monster runtime contains 103 RAW-certified templates', 1)
          browser.write_text(text, encoding='utf-8')

          save_test = Path('frontend/browser-monster-saves.test.cjs')
          text = save_test.read_text(encoding='utf-8')
          old = 'assert.equal(monsters.length, 101, "Only currently RAW-certified monsters belong in the generated runtime");'
          new = 'assert.equal(monsters.length, 103, "Only currently RAW-certified monsters belong in the generated runtime");'
          if old not in text:
              raise SystemExit('Browser save roster-count contract drifted.')
          save_test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Enforce source limits before generation
        run: python scripts/check_source_limits.py
      - name: Regenerate declarative runtime and static artifacts
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
      - name: Prove generated artifacts are deterministic
        run: |
          python scripts/export_runtime_monster_capabilities.py --check
          python scripts/verify_certification_manifests.py
      - name: Certify full Python rules reference
        working-directory: backend
        run: pytest -q
      - name: Validate every browser regression
        run: |
          for file in frontend/*.js; do node --check "$file"; done
          for file in frontend/*.test.cjs; do echo "RUN $file"; node "$file"; done
      - name: Report certification result
        run: |
          python scripts/report_certification_progress.py
          python scripts/report_zero_engine_monsters.py
          python scripts/report_capability_yield.py
      - name: Prove scoped candidate changes
        run: |
          rm -rf backend/iron_pit_backend.egg-info
          git status --short
          test -z "$(git status --porcelain --untracked-files=all | grep -vE '^( M|M |MM) (backend/app/content/monster_catalog.py|backend/app/content/figure_profiles.py|backend/app/content/data/combatant_capabilities_v1.json|backend/tests/test_arena_roster.py|backend/tests/test_figure_profiles.py|backend/tests/test_full_content_catalog.py|backend/tests/test_monster_source_audit.py|backend/tests/test_public_readiness.py|frontend/browser-generated-monsters.test.cjs|frontend/browser-monster-saves.test.cjs|frontend/browser-monsters-generated.js|frontend/figure-profiles.js|data/(hero|monster)_certification_manifest.json)$')"
      - name: Persist only after complete green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/content/monster_catalog.py backend/app/content/figure_profiles.py \
            backend/app/content/data/combatant_capabilities_v1.json \
            backend/tests/test_arena_roster.py backend/tests/test_figure_profiles.py \
            backend/tests/test_full_content_catalog.py backend/tests/test_monster_source_audit.py \
            backend/tests/test_public_readiness.py \
            frontend/browser-generated-monsters.test.cjs frontend/browser-monster-saves.test.cjs \
            frontend/browser-monsters-generated.js frontend/figure-profiles.js \
            data/hero_certification_manifest.json data/monster_certification_manifest.json
          git commit -m "feat: promote Zombie and Ogre Zombie"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
