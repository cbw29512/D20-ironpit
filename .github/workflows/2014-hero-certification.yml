name: 2014 Hero Certification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: hero-2014-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify-2014-heroes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical browser artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/prepare_static_site.py
      - name: Certify 2014 hero Python behavior
        run: |
          set -o pipefail
          pytest -q \
            backend/tests/test_cleric_life_2014_progression.py \
            backend/tests/test_cleric_life_2014_level2.py \
            backend/tests/test_cleric_life_2014_level3.py \
            backend/tests/test_cleric_life_2014_level6.py \
            backend/tests/test_cleric_life_2014_level7.py \
            backend/tests/test_cleric_life_2014_level8.py \
            backend/tests/test_once_per_turn_hit_damage.py \
            backend/tests/test_pooled_healing.py \
            backend/tests/test_turn_undead_2014.py \
            backend/tests/test_monk_open_hand_2014.py \
            backend/tests/test_monk_open_hand_2014_level18.py \
            backend/tests/test_paladin_2014_spell_package.py \
            backend/tests/test_paladin_auras_2014.py \
            backend/tests/test_paladin_channel_divinity_2014.py \
            backend/tests/test_paladin_devotion_2014_foundation.py \
            backend/tests/test_paladin_oath_spells_2014.py \
            backend/tests/test_certification_progression_manifest.py 2>&1 | tee 2014-hero-pytest.log
      - name: Upload 2014 hero pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2014-hero-pytest-${{ github.sha }}
          path: 2014-hero-pytest.log
          retention-days: 1
      - name: Certify 2014 hero data and browser behavior
        run: |
          set -o pipefail
          {
            node frontend/browser-catalog-2014.test.cjs
            node frontend/browser-ruleset-isolation.test.cjs
            node frontend/browser-survivor.test.cjs
            node frontend/browser-roll-revisions.test.cjs
            node frontend/browser-2014-berserker.test.cjs
            node frontend/browser-2014-rogue.test.cjs
            node frontend/browser-2014-monk.test.cjs
            node frontend/browser-2014-monk-level19.test.cjs
            node frontend/browser-2014-monk-level20.test.cjs
            node frontend/browser-initiative-resource-refill.test.cjs
            node frontend/browser-timed-self-buffs.test.cjs
            node frontend/browser-2014-monk-entrypoints.test.cjs
            node frontend/browser-2014-paladin.test.cjs
            node frontend/browser-2014-paladin-auras.test.cjs
            node frontend/browser-paladin-oath-spells-2014.test.cjs
            node frontend/browser-2014-paladin-entrypoints.test.cjs
            node frontend/browser-turn-undead-2014.test.cjs
            node frontend/browser-once-per-turn-hit-damage.test.cjs
            node frontend/browser-persistent-spell-attacks.test.cjs
          } 2>&1 | tee 2014-hero-browser.log
      - name: Upload 2014 hero browser log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2014-hero-browser-${{ github.sha }}
          path: 2014-hero-browser.log
          retention-days: 1
