name: One-shot Bard 16 generated artifact sync

on:
  push:
    branches:
      - feat/2024-bard-level16

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-bard-level16
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical Bard 16 artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit generator-owned outputs and remove one-shot workflow
        run: |
          rm .github/workflows/sync-bard16-generated-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js data/hero_certification_manifest.json .github/workflows/sync-bard16-generated-once.yml
          git diff --cached --check
          git commit -m "chore: sync Bard 16 generated artifacts"
          git push origin HEAD:feat/2024-bard-level16
