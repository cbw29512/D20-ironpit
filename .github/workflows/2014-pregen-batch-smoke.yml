name: 2014 Pregen Batch Smoke

on:
  push:
    branches:
      - "batch/2014-*"

permissions:
  contents: read

concurrency:
  group: pregen-2014-batch-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targeted-pregen-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Run only current 2014 batch-targeted tests
        run: |
          pytest -q \
            backend/tests/test_paladin_devotion_2014_level13_prep.py \
            backend/tests/test_paladin_devotion_2014_high_level_prep.py \
            backend/tests/test_paladin_auras_2014.py \
            backend/tests/test_split_save_damage.py \
            backend/tests/test_bard_lore_2014_prep.py \
            backend/tests/test_ranger_hunter_2014_prep.py \
            backend/tests/test_sorcerer_draconic_2014_prep.py \
            backend/tests/test_warlock_fiend_2014_prep.py \
            backend/tests/test_druid_land_2014_prep.py \
            backend/tests/test_wizard_evoker_2014_prep.py \
            backend/tests/test_once_per_turn_hit_damage.py \
            backend/tests/test_2014_pregen_batch_spines.py \
            backend/tests/test_2014_shared_caster_spells.py \
            backend/tests/test_zero_hp_temporary_hp_rewards.py
          node frontend/browser-2014-paladin-auras.test.cjs
          node frontend/browser-passive-opening-modifiers.test.cjs
          node frontend/browser-split-save-damage.test.cjs
          node frontend/browser-once-per-turn-hit-damage.test.cjs
          node frontend/browser-zero-hp-rewards.test.cjs
