name: 2014 Pregen Batch Smoke

on:
  push:
    branches:
      - "batch/2014-*"

permissions:
  contents: read

concurrency:
  group: pregen-2014-batch-smoke-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  targeted-pregen-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Run only current 2014 batch-targeted tests
        run: |
          pytest -q \
            backend/tests/test_paladin_devotion_2014_level13_prep.py \
            backend/tests/test_pregen_2014_source_packets.py \
            backend/tests/test_bard_lore_2014_prep.py \
            backend/tests/test_druid_land_2014_prep.py \
            backend/tests/test_ranger_hunter_2014_prep.py \
            backend/tests/test_sorcerer_draconic_2014_prep.py \
            backend/tests/test_warlock_fiend_2014_prep.py \
            backend/tests/test_wizard_evoker_2014_prep.py \
            backend/tests/test_difficult_terrain_bypass.py \\
            backend/tests/test_spell_upcasting_2014.py
      - name: Run current browser batch-targeted parity checks
        run: |
          node frontend/browser-spell-upcasting-2014.test.cjs
      - name: Run targeted browser movement parity
        run: node frontend/browser-grid-movement.test.cjs
