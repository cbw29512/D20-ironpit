name: Browser Regression Fast Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4

      - name: Validate browser JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in frontend/*.js; do
            node --check "$file"
          done

      - name: Run browser regressions with first-failure capture
        shell: bash
        run: |
          set -uo pipefail
          : > browser-regression-output.txt
          : > browser-regression-failure.txt
          count=0
          for test_file in frontend/*.test.cjs; do
            echo "Running $test_file" | tee -a browser-regression-output.txt
            node "$test_file" 2>&1 | tee -a browser-regression-output.txt
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "$test_file" | tee browser-regression-failure.txt
              exit "$status"
            fi
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Ran $count browser regression files." | tee -a browser-regression-output.txt

      - name: Upload browser regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-diagnostics-${{ github.sha }}
          path: |
            browser-regression-output.txt
            browser-regression-failure.txt
          retention-days: 1
