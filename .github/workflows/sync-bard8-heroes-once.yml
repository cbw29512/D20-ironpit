name: One-shot Bard 8 hero artifact sync

on:
  push:
    branches:
      - feat/2024-bard-level8

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-bard-level8
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical browser heroes
        run: python scripts/export_browser_heroes.py
      - name: Commit generated hero registry and remove one-shot workflow
        run: |
          rm .github/workflows/sync-bard8-heroes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js .github/workflows/sync-bard8-heroes-once.yml
          git diff --cached --check
          git commit -m "chore: sync Bard 8 generated hero registry"
          git push origin HEAD:feat/2024-bard-level8
