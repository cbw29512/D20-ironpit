name: Refresh Assassinate Generated Artifacts
on:
  push:
    branches:
      - fix/assassinate-clean-main-20261010
    paths:
      - .github/workflows/assassinate-artifact-refresh.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assassinate-clean-main-20261010
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project rules
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate authoritative artifacts
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/export_browser_monsters_2014.py
          git add backend/app/content/data/combatant_capabilities_v1.json frontend/browser-monsters-2014.js
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: regenerate Assassin browser and capability artifacts"
            git push origin HEAD:fix/assassinate-clean-main-20261010
          fi
