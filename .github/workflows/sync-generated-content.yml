name: Sync Generated Content

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write

concurrency:
  group: generated-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate all derived content
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/export_roster_mechanic_checklist.py
          python scripts/export_monster_mechanic_inventory.py
          python scripts/export_canonical_progression_engine_audit.py
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit derived artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/content/data/combatant_capabilities_v1.json
          git add data/hero_certification_manifest.json data/monster_certification_manifest.json
          git add data/roster_combat_mechanics_v1.json data/monster_mechanic_inventory_v1.json data/canonical_progression_engine_audit.json
          git add frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js
          git add frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          if git diff --cached --quiet; then
            echo 'Generated content is already current.'
            exit 0
          fi
          git commit -m 'chore: sync generated Iron Pit content'
          git push origin HEAD:${{ github.ref_name }}
