name: One-shot Bard 20 preflight and generated sync

on:
  push:
    branches:
      - feat/2024-bard-level20

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-bard-level20
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Check source limits
        run: python scripts/check_source_limits.py
      - name: Run Bard 20 RAW Python regressions
        working-directory: backend
        run: pytest -q tests/test_bard_2024_level20.py tests/test_2024_spell_edition_isolation.py
      - name: Run Words of Creation browser regression
        run: node frontend/browser-words-of-creation-2024.test.cjs
      - name: Generate canonical Bard 20 artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit generator-owned outputs and remove one-shot workflow
        run: |
          rm .github/workflows/sync-bard20-generated-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js data/hero_certification_manifest.json .github/workflows/sync-bard20-generated-once.yml
          git diff --cached --check
          git commit -m "chore: sync Bard 20 generated artifacts"
          git push origin HEAD:feat/2024-bard-level20
