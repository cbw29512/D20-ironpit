name: Forced Movement Parity

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: forced-movement-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  forced-movement-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Run Python forced movement regressions
        working-directory: backend
        run: pytest -q tests/test_forced_movement.py tests/test_immediate_push.py
      - name: Run browser forced movement regressions
        run: |
          node frontend/browser-forced-push.test.cjs
          node frontend/browser-immediate-push.test.cjs
