name: Refresh failed-save integration

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: pip install -e './backend[dev]'
      - name: Wire browser failed-save effects
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '<script src="browser-dodge.js"></script><script src="browser-saves.js"></script>'
          new = '<script src="browser-dodge.js"></script><script src="browser-save-failure-effects.js"></script><script src="browser-saves.js"></script>'
          for name in ('frontend/index.html', 'index.html'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise RuntimeError(f'{name}: expected exactly one browser save load site')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Regenerate capability registry
        run: python scripts/export_runtime_monster_capabilities.py
      - name: Commit canonical integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html index.html backend/app/content/data/combatant_capabilities_v1.json
          if git diff --cached --quiet; then
            echo "Integration artifacts already current."
            exit 0
          fi
          git commit -m "build: refresh failed-save integration artifacts"
          git push origin HEAD:feat/monster-recharge-v1
