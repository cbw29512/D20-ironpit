name: One-shot Iron Pit Wanted Preview (draft only)

# Runs only for this fixed QA branch, built from the already-certified source.
# Netlify production is locked and never changed by this job.
on:
  push:
    branches: [release/wanted-netlify-draft-preview]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_TOKEN }}
      NETLIFY_SITE_ID: e004bd85-0699-482a-91b2-1066333585ca
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Refuse unverified source or a production deploy
        shell: bash
        run: |
          set -euo pipefail
          expected=e829705c78440c6154ef1e1fb7ffaef627871eb8
          git cat-file -e "$expected^{commit}"
          test "$(git diff --name-only "$expected" HEAD)" = ".github/workflows/wanted-netlify-draft-preview.yml"
          test -s frontend/index.html
          test -s frontend/browser-monsters-2014.js
          test -s frontend/browser-wanted-2014.js
          grep -Fq 'id="wanted-board"' frontend/index.html
          grep -Fq 'browser-wanted-posters.js' frontend/index.html
          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "No existing Netlify auth secret. Draft preview cannot deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish named Netlify DRAFT preview (never production)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --dir=frontend \
            --no-build \
            --alias=ironpit-wanted-review \
            --json > "$RUNNER_TEMP/ironpit-draft.json"
          python3 - <<'PY'
          import json
          import logging
          import os
          from pathlib import Path
          logging.basicConfig(level=logging.INFO)
          try:
              data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ironpit-draft.json").read_text())
              draft = str(data.get("deploy_url", ""))
              if not draft.startswith("https://") or "ironpit-wanted-review--ironpit.netlify.app" not in draft:
                  raise ValueError("CLI did not report the expected named draft URL.")
              logging.info("Iron Pit QA draft: %s", draft)
              logging.info("Production was not targeted.")
          except Exception:
              logging.exception("Netlify draft deployment verification failed.")
              raise
          PY
