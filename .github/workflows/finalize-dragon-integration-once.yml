name: Finalize Dragon Integration Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

concurrency:
  group: finalize-dragon-integration-once
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical browser artifacts
        run: python scripts/prepare_static_site.py
      - name: Prove dragon integration regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_browser_unarmed_opportunity.py \
            tests/test_figure_profiles.py \
            tests/test_chromatic_wyrmling_recharge_combat.py \
            tests/test_young_chromatic_dragon_recharge_combat.py \
            tests/test_recharge_area_engine.py
      - name: Prove browser consumers
        run: |
          node frontend/figure-visuals.test.cjs
          node frontend/browser-reactions.test.cjs
          python scripts/check_source_limits.py
      - name: Commit generated browser integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-unarmed-opportunity.js frontend/figure-profiles.js
          if git diff --cached --quiet; then
            echo "No generated browser changes to commit."
            exit 0
          fi
          git commit -m "fix: keep certified dragons in browser parity"
          git push origin HEAD:feat/monster-recharge-v1
