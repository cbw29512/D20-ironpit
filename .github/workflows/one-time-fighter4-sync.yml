name: One-time Fighter 4 certification sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: fighter4-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Promote exact expected Fighter 4 surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('backend/tests/test_full_content_catalog.py'): (
                  '("fighter", 3, "canonical", "Karnok Stoneward", "karnok-stoneward-l3"),\n',
                  '("fighter", 3, "canonical", "Karnok Stoneward", "karnok-stoneward-l3"),\n'
                  '        ("fighter", 4, "canonical", "Karnok Stoneward", "karnok-stoneward-l4"),\n',
              ),
              Path('backend/tests/test_arena_roster.py'): (
                  '"karnok-stoneward-l1", "karnok-stoneward-l2", "karnok-stoneward-l3", "rokhan-stonefury-l1",',
                  '"karnok-stoneward-l1", "karnok-stoneward-l2", "karnok-stoneward-l3", "karnok-stoneward-l4", "rokhan-stonefury-l1",',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f'Expected Fighter 4 sync anchor missing in {path}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Generate canonical browser artifacts
        run: python scripts/prepare_static_site.py
      - name: Regenerate durable certification manifests
        run: python scripts/verify_certification_manifests.py --write
      - name: Verify generated certification state
        run: |
          python scripts/verify_certification_manifests.py
          python scripts/report_certification_progress.py
      - name: Certify Fighter 4 Python promotion
        working-directory: backend
        run: >-
          pytest -q
          tests/test_fighter_level4.py
          tests/test_champion_fighter.py
          tests/test_fighter_progression.py
          tests/test_hero_progressions.py
          tests/test_public_readiness.py
          tests/test_full_content_catalog.py
          tests/test_arena_roster.py
          tests/test_pregen_combat_audit.py
      - name: Certify Fighter 4 browser promotion
        run: |
          node frontend/browser-champion.test.cjs
          node frontend/browser-fighter4.test.cjs
      - name: Commit synchronized Fighter 4 checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            backend/tests/test_full_content_catalog.py \
            backend/tests/test_arena_roster.py \
            frontend/browser-heroes.js \
            frontend/figure-profiles.js \
            frontend/browser-monsters-generated.js \
            frontend/data/srd_5_2_1_monsters.json \
            data/hero_certification_manifest.json \
            data/monster_certification_manifest.json
          if git diff --cached --quiet; then
            echo 'No Fighter 4 synchronization changes to commit.'
            exit 0
          fi
          git commit -m 'build: sync Fighter 4 certification checkpoint'
          git push origin HEAD:${{ github.ref_name }}
