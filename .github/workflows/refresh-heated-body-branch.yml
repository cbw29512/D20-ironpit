name: Temporary Heated Body artifact refresh
on:
  push:
    branches: [feat/2014-heated-body-passive-retaliation]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate 2014 Heated Body outputs [skip refresh]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator dependencies
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate source-owned outputs
        run: |
          python scripts/export_roster_mechanic_checklist.py
          python scripts/export_monster_fix_list_2014.py
          python scripts/export_universal_mechanic_inventory.py
          python scripts/export_runtime_monster_capabilities.py
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit refreshed outputs to this branch
        run: |
          git config user.name iron-pit-certification
          git config user.email actions@users.noreply.github.com
          git add -u
          if git diff --cached --quiet; then echo "Outputs already current."; else
            git commit -m 'Regenerate 2014 Heated Body outputs [skip refresh]'
            git push origin HEAD:${{ github.ref_name }}
          fi
