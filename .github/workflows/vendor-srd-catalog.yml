name: Vendor SRD 5.2.1 catalog

on:
  push:
    branches:
      - feat/full-content-catalog

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Iron Pit
        uses: actions/checkout@v4
        with:
          ref: feat/full-content-catalog
          fetch-depth: 0

      - name: Check out audited DungeonCards source
        uses: actions/checkout@v4
        with:
          repository: cbw29512/DungeonCards
          ref: a0a1de7b45d89c2ab26adf4a3e3db8b2fd8bf520
          path: _dungeoncards

      - name: Vendor 2024 monster records
        run: |
          mkdir -p backend/app/content/data
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('_dungeoncards/src/generated/srd-monsters.json')
          target = Path('backend/app/content/data/srd_5_2_1_monsters.json')
          records = json.loads(source.read_text(encoding='utf-8'))
          records = [row for row in records if row.get('edition') == 'srd-5.2.1-2024']
          records.sort(key=lambda row: (row.get('name', ''), row.get('id', '')))
          if len(records) != 328:
              raise SystemExit(f'Expected 328 SRD 5.2.1 monsters, found {len(records)}')
          target.write_text(json.dumps(records, separators=(',', ':'), ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Commit generated catalog
        run: |
          if [ -z "$(git status --porcelain -- backend/app/content/data/srd_5_2_1_monsters.json)" ]; then
            echo 'Catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/content/data/srd_5_2_1_monsters.json
          git commit -m 'data: vendor all 328 SRD 5.2.1 monsters'
          git push origin HEAD:feat/full-content-catalog
