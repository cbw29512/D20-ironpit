name: Temporary Generated Artifact Sync

on:
  push:
    branches:
      - feat/2014-ranger-batched
    paths-ignore:
      - frontend/browser-heroes.js
      - frontend/browser-monsters-generated.js
      - frontend/browser-monsters-2014.js
      - frontend/browser-spell-effects.js
      - frontend/data/srd_5_2_1_monsters.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2014-ranger-batched
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e .
      - name: Regenerate canonical static artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/prepare_static_site.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js frontend/figure-profiles.js \
            frontend/browser-monsters-generated.js frontend/browser-monsters-2014.js \
            frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "chore: sync generated static artifacts"
          git push origin HEAD:feat/2014-ranger-batched
