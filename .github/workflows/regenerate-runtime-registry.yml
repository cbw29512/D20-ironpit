name: Regenerate Runtime Registry

on:
  push:
    branches:
      - fix/universal-arena-hospitality

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/universal-arena-hospitality
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate authoritative runtime capability registry
        run: python scripts/export_runtime_monster_capabilities.py
      - name: Validate generated diff
        run: |
          git diff --check
          git diff --exit-code --quiet -- backend/app/content/data/combatant_capabilities_v1.json && exit 1 || true
      - name: Commit generated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/content/data/combatant_capabilities_v1.json
          git commit -m "chore: regenerate corrected monster capability registry"
          git push origin HEAD:fix/universal-arena-hospitality
