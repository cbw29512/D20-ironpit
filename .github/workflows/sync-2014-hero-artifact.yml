name: Sync 2014 Hero Artifact

on:
  push:
    branches:
      - feat/2014-berserker-exhaustion

permissions:
  contents: write

concurrency:
  group: sync-2014-hero-artifact
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2014-berserker-exhaustion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical hero artifact
        run: python scripts/export_browser_heroes.py
      - name: Commit exact generated artifact when needed
        run: |
          if git diff --quiet -- frontend/browser-heroes.js; then
            echo "Generated browser hero artifact is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js
          git commit -m "Sync generated browser hero artifact"
          git push origin HEAD:feat/2014-berserker-exhaustion
