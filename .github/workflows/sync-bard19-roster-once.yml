name: One-shot Bard 19 roster checklist sync

on:
  push:
    branches:
      - feat/2024-bard-level19

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-bard-level19
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate roster mechanic checklist
        run: python scripts/export_roster_mechanic_checklist.py
      - name: Commit generator-owned checklist and remove one-shot workflow
        run: |
          rm .github/workflows/sync-bard19-roster-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster_combat_mechanics_v1.json .github/workflows/sync-bard19-roster-once.yml
          git diff --cached --check
          git commit -m "chore: sync Bard 19 roster mechanics"
          git push origin HEAD:feat/2024-bard-level19
