name: Sync Generated Once

on:
  push:
    branches:
      - feat/monster-recharge-v1
    paths:
      - .github/workflows/sync-generated-once.yml

permissions:
  contents: write

jobs:
  sync-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical artifacts
        run: |
          python scripts/verify_certification_manifests.py --write
          python scripts/prepare_static_site.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hero_certification_manifest.json data/monster_certification_manifest.json frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync Spy generated artifacts"
          git push origin HEAD:feat/monster-recharge-v1
