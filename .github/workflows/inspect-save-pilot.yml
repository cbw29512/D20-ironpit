name: Inspect save pilot candidates

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - name: Print Lion source row
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('backend/app/content/data/srd_5_2_1_monsters.json').read_text())
          row = next(item for item in rows if item.get('name') == 'Lion')
          print(json.dumps(row, indent=2, sort_keys=True))
          PY
