name: Inspect save pilot candidates

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: read

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - name: Print simple save-condition candidates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path('backend/app/content/data/srd_5_2_1_monsters.json').read_text())
          for row in rows:
              actions = str(row.get('actions', ''))
              if 'Saving Throw:' not in actions or 'condition' not in actions:
                  continue
              complexity = sum(term.lower() in actions.lower() for term in (
                  'second failure', 'destroyed', 'while poisoned', 'minute', 'hour', 'action to', 'magic action',
              ))
              if complexity <= 1:
                  print(f"=== {row['name']} | CR {row['challenge']} | complexity {complexity} ===")
                  print(actions)
          PY
