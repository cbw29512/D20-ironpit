name: Sync Generated Certification Artifacts

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830
      # Active certification branch: keep authoritative ledgers current after every engine increment.
      - feat/monster-recharge-v1

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-generated-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Remove editable-install metadata
        run: rm -rf backend/iron_pit_backend.egg-info
      - name: Generate authoritative certification artifacts
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/export_browser_heroes.py
          python scripts/export_browser_monsters.py
          python scripts/export_figure_profiles.py
          python scripts/verify_certification_manifests.py --write
          python scripts/export_roster_mechanic_checklist.py
      - name: Refuse unexpected generator drift
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(backend/app/content/data/combatant_capabilities_v1.json|frontend/browser-heroes.js|frontend/browser-monsters-generated.js|frontend/figure-profiles.js|data/hero_certification_manifest.json|data/monster_certification_manifest.json|data/roster_combat_mechanics_v1.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Generator modified files outside its owned outputs:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit only generator-owned outputs
        id: generated_sync
        run: |
          outputs="backend/app/content/data/combatant_capabilities_v1.json frontend/browser-heroes.js frontend/browser-monsters-generated.js frontend/figure-profiles.js data/hero_certification_manifest.json data/monster_certification_manifest.json data/roster_combat_mechanics_v1.json"
          if git diff --quiet -- $outputs; then
            echo "Generated artifacts already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $outputs
          git diff --cached --check
          git commit -m "chore: sync generated certification artifacts"
          git push origin HEAD:${{ github.ref_name }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Certify generated exact head
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${{ github.ref_name }}" | awk '{print $1}')"
          local_head="$(git rev-parse HEAD)"
          test "$local_head" = "$remote_head"
          echo "Certifying generated exact head: $local_head"
          python scripts/check_source_limits.py
          python scripts/check_combat_engine_coverage.py
          python scripts/export_roster_mechanic_checklist.py --check
          python scripts/export_runtime_monster_capabilities.py --check
          env -u GITHUB_EVENT_PATH GITHUB_SHA="$local_head" python scripts/verify_certification_manifests.py --write
          git diff --exit-code -- data/hero_certification_manifest.json data/monster_certification_manifest.json
          python scripts/prepare_static_site.py
          git diff --exit-code -- frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          (cd backend && pytest -q)
          for file in frontend/*.js; do node --check "$file"; done
          for test_file in frontend/*.test.cjs; do node "$test_file"; done
      - name: Dispatch canonical CI for generated exact head
        if: always() && steps.generated_sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"ref\":\"${REF_NAME}\"}"
