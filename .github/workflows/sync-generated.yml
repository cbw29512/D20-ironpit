name: Sync Generated Certification Artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-generated-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/2014-')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Remove editable-install metadata
        run: rm -rf backend/iron_pit_backend.egg-info
      - name: Generate authoritative certification artifacts
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
          python scripts/export_roster_mechanic_checklist.py
          python scripts/export_monster_fix_list_2014.py
          python scripts/export_universal_mechanic_inventory.py
          python scripts/report_non_offensive_dodge_2014.py
          python scripts/report_death_trigger_bindings_2014.py
          python scripts/report_staged_disease_bindings_2014.py
          python scripts/report_fear_aura_bindings_2014.py
          python scripts/report_hold_monster_bindings_2014.py
          python scripts/report_wall_of_fire_bindings_2014.py
          python scripts/report_fireball_bindings_2014.py
          python scripts/report_innate_blur_bindings_2014.py
          python scripts/report_innate_blindness_bindings_2014.py
          python scripts/report_innate_nondetection_bindings_2014.py
          python scripts/report_innate_vicious_mockery_bindings_2014.py
          python scripts/report_innate_magic_missile_bindings_2014.py
          python scripts/report_innate_detect_magic_bindings_2014.py
          python scripts/report_innate_ray_of_enfeeblement_bindings_2014.py
          python scripts/report_innate_sleep_bindings_2014.py
          python scripts/report_end_turn_recurring_damage_bindings_2014.py
      - name: Refuse unexpected generator drift
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(backend/app/content/data/combatant_capabilities_v1.json|frontend/browser-heroes.js|frontend/browser-monsters-generated.js|frontend/browser-monsters-2014.js|frontend/browser-spell-effects.js|frontend/figure-profiles.js|frontend/data/srd_5_2_1_monsters.json|data/hero_certification_manifest.json|data/monster_certification_manifest.json|data/roster_combat_mechanics_v1.json|data/universal_mechanic_inventory_v1.json|docs/MONSTER_BLOCKERS_2014.md|docs/UNIVERSAL_MECHANIC_INVENTORY.md|docs/generated/NON_OFFENSIVE_DODGE_2014.json|docs/generated/DEATH_TRIGGER_BINDINGS_2014.json|docs/generated/STAGED_DISEASE_BINDINGS_2014.json|docs/generated/FEAR_AURA_BINDINGS_2014.json|docs/generated/HOLD_MONSTER_BINDINGS_2014.json|docs/generated/WALL_OF_FIRE_BINDINGS_2014.json|docs/generated/FIREBALL_BINDINGS_2014.json|docs/generated/INNATE_BLUR_BINDINGS_2014.json|docs/generated/INNATE_BLINDNESS_BINDINGS_2014.json|docs/generated/INNATE_NONDETECTION_BINDINGS_2014.json|docs/generated/INNATE_VICIOUS_MOCKERY_BINDINGS_2014.json|docs/generated/INNATE_MAGIC_MISSILE_BINDINGS_2014.json|docs/generated/INNATE_DETECT_MAGIC_BINDINGS_2014.json|docs/generated/INNATE_RAY_OF_ENFEEBLEMENT_BINDINGS_2014.json|docs/generated/SLEEP_BINDINGS_2014.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Generator modified files outside its owned outputs:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit only generator-owned outputs
        run: |
          outputs="backend/app/content/data/combatant_capabilities_v1.json frontend/browser-heroes.js frontend/browser-monsters-generated.js frontend/browser-monsters-2014.js frontend/browser-spell-effects.js frontend/figure-profiles.js frontend/data/srd_5_2_1_monsters.json data/hero_certification_manifest.json data/monster_certification_manifest.json data/roster_combat_mechanics_v1.json data/universal_mechanic_inventory_v1.json docs/MONSTER_BLOCKERS_2014.md docs/UNIVERSAL_MECHANIC_INVENTORY.md docs/generated/NON_OFFENSIVE_DODGE_2014.json docs/generated/DEATH_TRIGGER_BINDINGS_2014.json docs/generated/STAGED_DISEASE_BINDINGS_2014.json docs/generated/FEAR_AURA_BINDINGS_2014.json docs/generated/HOLD_MONSTER_BINDINGS_2014.json docs/generated/WALL_OF_FIRE_BINDINGS_2014.json docs/generated/FIREBALL_BINDINGS_2014.json docs/generated/INNATE_BLUR_BINDINGS_2014.json docs/generated/INNATE_BLINDNESS_BINDINGS_2014.json docs/generated/INNATE_NONDETECTION_BINDINGS_2014.json docs/generated/INNATE_VICIOUS_MOCKERY_BINDINGS_2014.json docs/generated/INNATE_MAGIC_MISSILE_BINDINGS_2014.json docs/generated/INNATE_DETECT_MAGIC_BINDINGS_2014.json docs/generated/INNATE_RAY_OF_ENFEEBLEMENT_BINDINGS_2014.json docs/generated/SLEEP_BINDINGS_2014.json"
          untracked="$(git ls-files --others --exclude-standard -- $outputs)"
          if git diff --quiet -- $outputs && [ -z "$untracked" ]; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $outputs
          git diff --cached --check
          git commit -m "chore: sync generated certification artifacts"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
