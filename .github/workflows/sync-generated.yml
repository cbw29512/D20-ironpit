name: Sync Generated Certification Artifacts

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: sync-generated-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Remove editable-install metadata
        run: rm -rf backend/iron_pit_backend.egg-info
      - name: Generate authoritative certification artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/export_browser_monsters.py
          python scripts/verify_certification_manifests.py --write
      - name: Refuse unexpected generator drift
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(frontend/browser-heroes.js|frontend/browser-monsters-generated.js|data/hero_certification_manifest.json|data/monster_certification_manifest.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Generator modified files outside its owned outputs:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit only generator-owned outputs
        run: |
          outputs="frontend/browser-heroes.js frontend/browser-monsters-generated.js data/hero_certification_manifest.json data/monster_certification_manifest.json"
          if git diff --quiet -- $outputs; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $outputs
          git diff --cached --check
          git commit -m "chore: sync generated certification artifacts"
          git push origin HEAD:${{ github.ref_name }}
