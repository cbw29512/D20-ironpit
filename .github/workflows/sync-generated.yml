name: Sync Generated Certification Artifacts

on:
  push:
    branches:
      - feat/pregen-combat-completion

permissions:
  contents: write

concurrency:
  group: sync-generated-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Remove editable-install metadata
        run: rm -rf backend/iron_pit_backend.egg-info
      - name: Generate runtime monster capabilities
        run: python scripts/export_runtime_monster_capabilities.py
      - name: Generate browser heroes
        run: python scripts/export_browser_heroes.py
      - name: Generate browser monsters
        id: browser_monsters
        run: |
          set +e
          python scripts/export_browser_monsters.py > browser-monster-export.log 2>&1
          status=$?
          cat browser-monster-export.log
          exit $status
      - name: Upload browser monster export diagnostics
        if: failure() && steps.browser_monsters.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-monster-export-diagnostics-${{ github.sha }}
          path: browser-monster-export.log
          retention-days: 1
      - name: Generate figure profiles
        run: python scripts/export_figure_profiles.py
      - name: Generate certification manifests
        run: python scripts/verify_certification_manifests.py --write
      - name: Generate roster mechanic checklist
        run: python scripts/export_roster_mechanic_checklist.py
      - name: Generate universal engine backlog
        run: python scripts/report_universal_engine_backlog.py > data/universal_engine_backlog.txt
      - name: Generate detailed capability yield
        run: python scripts/report_capability_yield.py > data/capability_yield.txt
      - name: Generate normalized monster mechanic matrix
        run: python scripts/report_monster_mechanic_matrix.py --csv data/monster_mechanic_matrix.csv > data/monster_mechanic_matrix.txt
      - name: Refuse unexpected generator drift
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '{print $2}' | grep -Ev '^(backend/app/content/data/combatant_capabilities_v1.json|frontend/browser-heroes.js|frontend/browser-monsters-generated.js|frontend/figure-profiles.js|data/hero_certification_manifest.json|data/monster_certification_manifest.json|data/roster_combat_mechanics_v1.json|data/universal_engine_backlog.txt|data/capability_yield.txt|data/monster_mechanic_matrix.csv|data/monster_mechanic_matrix.txt)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Generator modified files outside its owned outputs:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit only generator-owned outputs
        run: |
          outputs="backend/app/content/data/combatant_capabilities_v1.json frontend/browser-heroes.js frontend/browser-monsters-generated.js frontend/figure-profiles.js data/hero_certification_manifest.json data/monster_certification_manifest.json data/roster_combat_mechanics_v1.json data/universal_engine_backlog.txt data/capability_yield.txt data/monster_mechanic_matrix.csv data/monster_mechanic_matrix.txt"
          if git diff --quiet -- $outputs && [ -z "$(git status --porcelain --untracked-files=all -- data/universal_engine_backlog.txt data/capability_yield.txt data/monster_mechanic_matrix.csv data/monster_mechanic_matrix.txt)" ]; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $outputs
          git diff --cached --check
          git commit -m "chore: sync generated certification artifacts"
          git push origin HEAD:${{ github.ref_name }}
