name: 2014 Basic Roster

on:
  push:
    paths:
      - "backend/app/content/monster_source_2014.py"
      - "backend/app/content/monster_basic_candidates_2014.py"
      - "backend/app/content/data/srd_5_1_monsters_catalog.json"
      - "backend/app/content/data/srd_5_1_monsters_source_manifest.json"
      - "scripts/report_2014_basic_candidates.py"
      - "scripts/report_2014_attack_riders.py"
      - ".github/workflows/2014-basic-roster.yml"
  pull_request:
    paths:
      - "backend/app/content/monster_source_2014.py"
      - "backend/app/content/monster_basic_candidates_2014.py"
      - "backend/app/content/data/srd_5_1_monsters_catalog.json"
      - "scripts/report_2014_basic_candidates.py"
      - "scripts/report_2014_attack_riders.py"
      - ".github/workflows/2014-basic-roster.yml"

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Report fail-closed 2014 basic roster
        run: python scripts/report_2014_basic_candidates.py
      - name: Report exact attack rider blocker shapes
        run: python scripts/report_2014_attack_riders.py
