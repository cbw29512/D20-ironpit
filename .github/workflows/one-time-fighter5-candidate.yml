name: One-time Fighter 5 candidate gate

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: read

concurrency:
  group: fighter5-candidate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce source limits
        run: python scripts/check_source_limits.py
      - name: Certify Fighter 5 candidate
        working-directory: backend
        run: pytest -q tests/test_fighter_level5.py tests/test_fighter_level4.py tests/test_champion_fighter.py tests/test_fighter_progression.py
      - name: Validate Tactical Shift browser syntax
        run: |
          node --check frontend/browser-tactical-shift.js
          node --check frontend/browser-turn.js
