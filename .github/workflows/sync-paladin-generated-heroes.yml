name: Sync Paladin Generated Heroes

on:
  push:
    branches:
      - feat/2014-devotion-paladin

permissions:
  contents: write

jobs:
  sync-generated-heroes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2014-devotion-paladin
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical browser heroes
        run: python scripts/export_browser_heroes.py
      - name: Commit generated hero artifact
        shell: bash
        run: |
          if git diff --quiet -- frontend/browser-heroes.js; then
            echo "Generated browser hero artifact is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js
          git commit -m "Refresh generated browser heroes for 2014 Paladin"
          git push origin HEAD:feat/2014-devotion-paladin
