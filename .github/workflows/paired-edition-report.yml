name: Paired Edition Monster Report

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "backend/app/content/**"
      - "scripts/report_paired_monster_progress.py"
      - ".github/workflows/paired-edition-report.yml"

permissions:
  contents: read

concurrency:
  group: paired-edition-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Report paired-edition monster progress
        run: python scripts/report_paired_monster_progress.py
