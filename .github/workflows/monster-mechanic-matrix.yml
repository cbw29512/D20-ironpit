name: Monster Mechanic Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Iron Pit rules engine
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Build normalized 330-monster combat capability sheets
        run: >-
          python scripts/report_monster_mechanic_matrix.py
          --csv data/monster_mechanic_matrix.csv
          --ability-csv data/monster_ability_equivalence.csv
          --capability-csv data/monster_capability_registry.csv
      - name: Upload Excel-friendly capability sheets
        uses: actions/upload-artifact@v4
        with:
          name: monster-combat-capability-sheets-${{ github.sha }}
          path: |
            data/monster_mechanic_matrix.csv
            data/monster_ability_equivalence.csv
            data/monster_capability_registry.csv
          retention-days: 7
