name: One-time native swarm promotion

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: native-swarm-promotion-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Promote native swarms into public certification expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
              Path("backend/app/content/monster_catalog.py"): [(
                  '    "Swarm of Bats": "srd-swarm-of-bats", "Swarm of Crawling Claws": "srd-swarm-of-crawling-claws",\n    "Swarm of Rats": "srd-swarm-of-rats", "Tough": "srd-tough",',
                  '    "Swarm of Bats": "srd-swarm-of-bats", "Swarm of Crawling Claws": "srd-swarm-of-crawling-claws",\n    "Swarm of Insects": "srd-swarm-of-insects", "Swarm of Rats": "srd-swarm-of-rats",\n    "Swarm of Venomous Snakes": "srd-swarm-of-venomous-snakes", "Tough": "srd-tough",',
              )],
              Path("backend/tests/test_arena_roster.py"): [(
                  '        "srd-swarm-of-bats", "srd-swarm-of-rats", "srd-swarm-of-crawling-claws",\n        "srd-bandit-captain",',
                  '        "srd-swarm-of-bats", "srd-swarm-of-rats", "srd-swarm-of-crawling-claws",\n        "srd-swarm-of-insects", "srd-swarm-of-venomous-snakes",\n        "srd-bandit-captain",',
              )],
              Path("backend/tests/test_full_content_catalog.py"): [
                  ('    assert len(ready_monsters) == 99', '    assert len(ready_monsters) == 101'),
                  (
                      '        "Spider": "srd-spider", "Swarm of Bats": "srd-swarm-of-bats",\n        "Swarm of Crawling Claws": "srd-swarm-of-crawling-claws", "Swarm of Rats": "srd-swarm-of-rats",',
                      '        "Spider": "srd-spider", "Swarm of Bats": "srd-swarm-of-bats",\n        "Swarm of Crawling Claws": "srd-swarm-of-crawling-claws", "Swarm of Insects": "srd-swarm-of-insects",\n        "Swarm of Rats": "srd-swarm-of-rats", "Swarm of Venomous Snakes": "srd-swarm-of-venomous-snakes",',
                  ),
              ],
              Path("frontend/browser-generated-monsters.test.cjs"): [
                  (
                      'assert.equal(Object.keys(generated).length, 99, "Generated runtime must expose only currently RAW-certified monsters");',
                      'assert.equal(Object.keys(generated).length, 101, "Generated runtime must expose only currently RAW-certified monsters");',
                  ),
                  (
                      '  "srd-swarm-of-bats", "srd-swarm-of-rats", "srd-swarm-of-crawling-claws",',
                      '  "srd-swarm-of-bats", "srd-swarm-of-rats", "srd-swarm-of-crawling-claws",\n  "srd-swarm-of-insects", "srd-swarm-of-venomous-snakes",',
                  ),
                  (
                      'assert.equal(generated["srd-swarm-of-crawling-claws"].attacks[0].proneMaxSize, "medium");',
                      '''assert.equal(generated["srd-swarm-of-crawling-claws"].attacks[0].proneMaxSize, "medium");
const insectSwarm = generated["srd-swarm-of-insects"];
assert.deepEqual(insectSwarm.source_trait_names, ["Spider Climb", "Swarm"]);
assert.equal(insectSwarm.traits.includes("swarm"), true);
assert.deepEqual(insectSwarm.movement_modes, {
  walk_ft: 20, fly_ft: 20, climb_ft: 0, swim_ft: 0, burrow_ft: 0, hover: false,
});
assert.deepEqual(insectSwarm.attacks[0].conditionalDamage, {
  trigger: "attacker_bloodied", mode: "replace_weapon", diceCount: 1, diceSize: 4,
  damageBonus: 1, damageType: "poison",
});
const snakeSwarm = generated["srd-swarm-of-venomous-snakes"];
assert.deepEqual(snakeSwarm.source_trait_names, ["Swarm"]);
assert.equal(snakeSwarm.traits.includes("swarm"), true);
assert.equal(snakeSwarm.movement_modes.swim_ft, 30);
assert.deepEqual(snakeSwarm.attacks[0].onHitDamage, [
  { source: "Poison", diceCount: 3, diceSize: 6, damageBonus: 0, damageType: "poison" },
]);
assert.deepEqual(snakeSwarm.attacks[0].conditionalDamage, {
  trigger: "attacker_bloodied", mode: "replace_weapon", diceCount: 1, diceSize: 4,
  damageBonus: 4, damageType: "piercing",
});''',
                  ),
                  (
                      'console.log("Generated monster runtime contains 99 RAW-certified templates with Blood Hawk and Swarm conditional damage, Redirect Attack, and T. rex retargeting.");',
                      'console.log("Generated monster runtime contains 101 RAW-certified templates, including native data-only swarms, with conditional damage, Redirect Attack, and T. rex retargeting.");',
                  ),
              ],
          }
          for path, replacements in edits.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  if new in text:
                      continue
                  if old not in text:
                      raise RuntimeError(f"Promotion marker missing from {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Regenerate static browser artifacts and certification manifests
        run: |
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
      - name: Enforce source limits and immutable legacy capability snapshot
        run: |
          python scripts/check_source_limits.py
          python scripts/export_runtime_monster_capabilities.py --check
      - name: Certify full Python rules reference
        working-directory: backend
        run: pytest -q
      - name: Certify generated browser monsters and swarm behavior
        run: |
          node frontend/browser-generated-monsters.test.cjs
          node frontend/browser-swarm.test.cjs
      - name: Verify manifests and report certification progress
        run: |
          python scripts/verify_certification_manifests.py
          python scripts/report_certification_progress.py
      - name: Persist native swarm promotion
        run: |
          git add \
            backend/app/content/monster_catalog.py \
            backend/tests/test_arena_roster.py \
            backend/tests/test_full_content_catalog.py \
            frontend/browser-generated-monsters.test.cjs \
            frontend/browser-monsters-generated.js \
            frontend/data/srd_5_2_1_monsters.json \
            data/hero_certification_manifest.json \
            data/monster_certification_manifest.json
          if git diff --cached --quiet; then
            echo "Native swarm promotion artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: certify native data-only swarms"
          git push origin HEAD:${GITHUB_REF_NAME}
