name: Patch Killer Whale Browser Regression

on:
  push:
    branches:
      - fix/universal-arena-hospitality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Replace obsolete aquatic-only assertion
        run: |
          python - <<'PY'
          import logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("killer_whale_browser_regression")
          path = Path("frontend/browser-generated-monsters.test.cjs")
          old = 'assert.equal(generated["srd-killer-whale"], undefined, "Aquatic-only Killer Whale must remain deferred from the standard arena");'
          new = '''const killerWhale = generated["srd-killer-whale"];
          assert.ok(killerWhale, "Killer Whale must be present because Iron Pit environmental hospitality is universal");
          assert.equal(killerWhale.speed_ft, 5, "Killer Whale generic/base speed must preserve the printed 5-foot speed");
          assert.deepEqual(killerWhale.movement_modes, {
            walk_ft: 5, fly_ft: 0, climb_ft: 0, swim_ft: 60, burrow_ft: 0, hover: false,
          }, "Killer Whale must preserve its printed swim-speed fingerprint without reinterpreting it as generic speed");
          assert.deepEqual(killerWhale.source_trait_names, ["Hold Breath"], "Killer Whale must retain its source trait fingerprint");'''
          try:
              content = path.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected exactly one obsolete Killer Whale assertion, found {count}.")
              path.write_text(content.replace(old, new), encoding="utf-8")
              logger.info("Replaced obsolete Killer Whale browser regression with hospitality/source-fidelity assertions.")
          except Exception:
              logger.exception("Failed to patch Killer Whale browser regression.")
              raise
          PY
      - name: Verify targeted diff
        run: |
          git diff --check -- frontend/browser-generated-monsters.test.cjs
          git diff --exit-code -- . ':!frontend/browser-generated-monsters.test.cjs' || {
            echo "Unexpected files changed by targeted patch." >&2
            exit 1
          }
      - name: Commit targeted regression update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-generated-monsters.test.cjs
          git commit -m "test: certify Killer Whale browser hospitality"
          git push origin HEAD:${{ github.ref_name }}
