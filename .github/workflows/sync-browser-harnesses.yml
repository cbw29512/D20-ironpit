name: Sync Browser Harnesses

on:
  push:
    branches:
      - 'feat/**'

permissions:
  contents: write

concurrency:
  group: browser-harness-sync-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize all inline browser harness loaders
        run: |
          python scripts/sync_browser_harness_dependencies.py
          python scripts/check_browser_harness_dependencies.py
      - name: Commit synchronized harnesses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/*.test.cjs
          if git diff --cached --quiet; then
            echo 'Browser harness dependencies are already synchronized.'
            exit 0
          fi
          git commit -m 'test: sync browser harness dependency graph'
          git push origin HEAD:${{ github.ref_name }}
