name: Runtime Capability Candidate

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: runtime-capability-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  capability-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate runtime capability candidate
        run: python scripts/export_runtime_monster_capabilities.py
      - name: Upload runtime capability candidate
        uses: actions/upload-artifact@v4
        with:
          name: runtime-capabilities-${{ github.sha }}
          path: backend/app/content/data/combatant_capabilities_v1.json
          retention-days: 1
      - name: Sync generated runtime capability registry on certification branch
        if: github.event_name == 'push' && github.ref_name == 'fix/runtime-derived-monster-certification'
        run: |
          if git diff --quiet -- backend/app/content/data/combatant_capabilities_v1.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/content/data/combatant_capabilities_v1.json
          git commit -m "chore: sync runtime capability registry"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Enforce committed runtime capability parity
        run: git diff --exit-code -- backend/app/content/data/combatant_capabilities_v1.json
