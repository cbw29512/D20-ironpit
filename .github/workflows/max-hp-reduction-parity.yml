name: Max HP Reduction Parity

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: max-hp-reduction-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Python max HP reduction regressions
        working-directory: backend
        run: pytest -q tests/test_max_hp_reduction.py tests/test_zero_engine_rider_detection.py
      - name: Browser max HP reduction parity
        run: node frontend/browser-max-hp-reduction.test.cjs
