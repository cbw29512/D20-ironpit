      - 'scripts/audit_2014_source_fidelity.py'
      - 'scripts/verify_2014_full_catalog.py'
      - 'scripts/report_2014_monster_progress.py'
      - '.github/workflows/ci-2014-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-2014-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rules reference
        run: pip install -e 'backend[dev]'
      - name: Require tracked canonical catalog
        run: git ls-files --error-unmatch data/monsters/2014/catalog.json
      - name: Prove 2014 save/control/AoE source parser
        run: python scripts/test_2014_save_actions.py
      - name: Prove 2014 regular spellcasting parser
        run: python scripts/test_2014_spellcasting.py
      - name: Prove 2014 Multiattack policy parser
        run: python scripts/test_2014_multiattack_policy.py
      - name: Regenerate pinned 327-monster catalog
        run: python scripts/sync_2014_monster_catalog.py
      - name: Sync deterministic generated catalog
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- data/monsters/2014/catalog.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monsters/2014/catalog.json
          git commit -m "chore: sync generated 2014 catalog"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Enforce deterministic generated catalog
        run: git diff --exit-code -- data/monsters/2014/catalog.json
      - name: Upload regenerated catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-2014-catalog
          path: data/monsters/2014/catalog.json
          retention-days: 1
      - name: Audit pinned source fidelity
        run: python scripts/audit_2014_source_fidelity.py
      - name: Verify all 327 normalized records
        run: python scripts/verify_2014_full_catalog.py
      - name: Report reusable mechanic blockers
        run: python scripts/report_2014_monster_progress.py
      - name: Prove JSON-to-engine MVP
        run: >-
          cd backend && pytest -q
          tests/test_parry.py
          tests/test_2014_json_catalog.py
          tests/test_2014_poison_timing.py
          tests/test_2014_secondary_damage.py
          tests/test_2014_parry.py
          tests/test_2014_charge.py
          tests/test_2014_recharge.py
          tests/test_2014_area_recharge.py
          tests/test_2014_frightful_presence.py
          tests/test_2014_legendary_resistance.py
          tests/test_2014_on_hit_save.py
          tests/test_magic_resistance.py
          tests/test_conditional_damage_defenses.py
      - name: Prove 2014 browser rules parity
        run: |
          node frontend/browser-2014-grapple.test.cjs
          node frontend/browser-2014-poison.test.cjs
          node frontend/browser-2014-parry.test.cjs
          node frontend/browser-2014-magic-resistance.test.cjs
          node frontend/browser-2014-recharge.test.cjs
          node frontend/browser-2014-area-recharge.test.cjs
          node frontend/browser-2014-frightful-presence.test.cjs
          node frontend/browser-2014-multiattack-policy.test.cjs
