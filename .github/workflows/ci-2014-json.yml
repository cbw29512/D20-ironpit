name: 2014 JSON Monster MVP

on:
  pull_request:
    paths:
      - 'backend/app/content/monster_catalog_2014*.py'
      - 'backend/app/content/monster_spell_actions_2014.py'
      - 'backend/app/domain/**'
      - 'backend/app/combat/**'
      - 'backend/tests/test_2014_*.py'
      - 'backend/tests/test_monster_*_2014.py'
      - 'backend/tests/test_parry.py'
      - 'backend/tests/test_magic_resistance.py'
      - 'backend/tests/test_conditional_damage_defenses.py'
      - 'data/monsters/2014/**'
      - 'scripts/*2014*.py'
      - 'scripts/browser_template_serializer.py'
      - 'scripts/export_browser_monsters.py'
      - 'scripts/verify_certification_manifests.py'
      - 'index.html'
      - 'frontend/index.html'
      - 'frontend/browser-*.js'
      - 'frontend/browser-2014-*.test.cjs'
      - '.github/workflows/ci-2014-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-2014-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rules reference
        run: pip install -e 'backend[dev]'
      - name: Require tracked canonical catalog
        run: git ls-files --error-unmatch data/monsters/2014/catalog.json
      - name: Prove 2014 save/control/AoE source parser
        run: python scripts/test_2014_save_actions.py
      - name: Prove 2014 regular spellcasting parser
        run: python scripts/test_2014_spellcasting.py
      - name: Prove 2014 Multiattack policy parser
        run: python scripts/test_2014_multiattack_policy.py
      - name: Regenerate pinned 327-monster catalog
        run: python scripts/sync_2014_monster_catalog.py
      - name: Regenerate derived certification artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/export_browser_monsters.py
          python scripts/verify_certification_manifests.py --write
      - name: Sync deterministic generated artifacts
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          paths=(
            data/monsters/2014/catalog.json
            frontend/browser-heroes.js
            frontend/browser-monsters-generated.js
            data/hero_certification_manifest.json
            data/monster_certification_manifest.json
          )
          if git diff --quiet -- "${paths[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "chore: sync generated 2014 certification artifacts"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Enforce deterministic generated artifacts
        run: |
          git diff --exit-code -- \
            data/monsters/2014/catalog.json \
            frontend/browser-heroes.js \
            frontend/browser-monsters-generated.js \
            data/hero_certification_manifest.json \
            data/monster_certification_manifest.json
      - name: Upload regenerated catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-2014-catalog
          path: data/monsters/2014/catalog.json
          retention-days: 1
      - name: Audit pinned source fidelity
        run: python scripts/audit_2014_source_fidelity.py
      - name: Verify all 327 normalized records
        run: python scripts/verify_2014_full_catalog.py
      - name: Report reusable mechanic blockers
        run: python scripts/report_2014_monster_progress.py
      - name: Prove 2014 Python engine coverage
        run: |
          cd backend
          pytest -q \
            tests/test_2014_*.py \
            tests/test_monster_*_2014.py \
            tests/test_parry.py \
            tests/test_magic_resistance.py \
            tests/test_conditional_damage_defenses.py
      - name: Prove 2014 browser rules parity
        run: |
          for test in frontend/browser-2014-*.test.cjs; do
            node "$test"
          done
