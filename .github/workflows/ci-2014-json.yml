  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-2014-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rules reference
        run: pip install -e 'backend[dev]'
      - name: Require tracked canonical catalog
        run: test -f data/monsters/2014/catalog.json
      - name: Verify pinned source fidelity
        run: python scripts/audit_2014_source_fidelity.py
      - name: Verify model and parser regressions
        working-directory: backend
        run: |
          pytest -q \
            tests/test_2014_json_catalog.py \
            tests/test_2014_innate_substitution_credentials.py \
            tests/test_2014_rider_only_attacks.py \
            tests/test_2014_healing_action_import.py \
            tests/test_2014_poison_timing.py \
            tests/test_2014_secondary_damage.py \
            tests/test_2014_parry.py \
            tests/test_2014_charge.py \
            tests/test_2014_recharge.py \
            tests/test_2014_area_recharge.py \
            tests/test_2014_frightful_presence.py \
            tests/test_2014_legendary_resistance.py \
            tests/test_2014_on_hit_save.py \
            tests/test_save_failure_margin.py \
            tests/test_2014_heated_body.py \
            tests/test_2014_weapon_defense_policy.py \
            tests/test_2014_relentless.py \
            tests/test_2014_sleep_breath.py \
            tests/test_2014_slowing_breath.py \
            tests/test_2014_regeneration.py \
            tests/test_2014_fear_of_fire.py \
            tests/test_magic_resistance.py \
            tests/test_conditional_damage_defenses.py
      - name: Verify non-pytest parser regressions
        run: |
          python scripts/test_2014_save_actions.py
          python scripts/test_2014_failure_margin_saves.py
          python scripts/test_2014_spellcasting.py
          python scripts/test_2014_multiattack_policy.py
      - name: Regenerate pinned 2014 catalog
        run: python scripts/sync_2014_monster_catalog.py
      - name: Verify full 2014 catalog
        run: python scripts/verify_2014_full_catalog.py
      - name: Report full roster blockers
        run: python scripts/report_2014_monster_progress.py
      - name: Run browser parity regressions
        run: |
          node frontend/browser-2014-grapple.test.cjs
          node frontend/browser-2014-poison.test.cjs
          node frontend/browser-2014-parry.test.cjs
          node frontend/browser-2014-magic-resistance.test.cjs
          node frontend/browser-2014-recharge.test.cjs
          node frontend/browser-2014-area-recharge.test.cjs
          node frontend/browser-2014-frightful-presence.test.cjs
          node frontend/browser-2014-multiattack-policy.test.cjs
          node frontend/browser-2014-relentless.test.cjs
          node frontend/browser-2014-sleep-breath.test.cjs
          node frontend/browser-2014-slowing-breath.test.cjs
          node frontend/browser-2014-regeneration.test.cjs
          node frontend/browser-2014-fear-of-fire.test.cjs
          node frontend/browser-2014-heated-body.test.cjs
          node frontend/browser-save-failure-margin.test.cjs
      - name: Refresh certification ledger
        run: python scripts/export_2014_monster_ledger.py
      - name: Upload full 2014 catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: iron-pit-2014-monster-catalog
          path: data/monsters/2014/catalog.json
      - name: Persist refreshed catalog and ledger
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- data/monsters/2014/catalog.json data/monsters/2014/certification_ledger.json; then
            echo "2014 catalog and ledger unchanged."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/monsters/2014/catalog.json data/monsters/2014/certification_ledger.json
          git commit -m "certification: refresh 2014 catalog and monster ledger"
          git push origin HEAD:${{ github.head_ref }}
      - name: Enforce refreshed catalog and ledger parity
        run: |
          git diff --exit-code -- data/monsters/2014/catalog.json data/monsters/2014/certification_ledger.json
          python scripts/export_2014_monster_ledger.py --check
