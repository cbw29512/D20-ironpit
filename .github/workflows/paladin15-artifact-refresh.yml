name: Temporary Paladin 15 Artifact Refresh

on:
  push:
    branches: ["feat/2024-paladin-15"]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[skip refresh]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-paladin-15
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/export_browser_monsters.py
          python scripts/export_browser_monsters_2014.py
          python scripts/verify_certification_manifests.py --write
          python scripts/prepare_static_site.py
      - name: Commit generated parity
        run: |
          git config user.name "iron-pit-certification"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "Generated artifacts already match."
          else
            git commit -m "Refresh generated Paladin 15 artifacts [skip refresh]"
            git push origin HEAD:feat/2024-paladin-15
          fi
