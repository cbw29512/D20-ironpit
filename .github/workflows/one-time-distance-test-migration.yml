name: One-time distance test migration

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove obsolete starting-distance arguments from tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('backend/tests')
          changed = []
          for path in root.glob('test_*.py'):
              if path.name == 'test_public_readiness.py':
                  continue
              text = path.read_text()
              updated = re.sub(r',\s*starting_distance_ft\s*=\s*(?:\d+|starting_distance_ft)', '', text)
              updated = re.sub(r'starting_distance_ft\s*=\s*(?:\d+|starting_distance_ft)\s*,\s*', '', updated)
              updated = re.sub(r'\n\s*starting_distance_ft\s*=\s*(?:\d+|starting_distance_ft)\s*,?', '', updated)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('No stale starting-distance test fixtures found.')
          print('\n'.join(changed))
          PY
      - name: Commit migrated test fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests
          git commit -m "test: migrate removed starting-distance fixtures"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
