name: Bind Young Chromatic Dragons Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

concurrency:
  group: bind-young-chromatic-dragons-once
  cancel-in-progress: true

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind five young chromatic dragons declaratively
        run: |
          python - <<'PY'
          import json
          import logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("bind_young_chromatic_dragons")
          abilities = ["strength", "dexterity", "constitution", "intelligence", "wisdom", "charisma"]
          specs = [
              {
                  "slug": "young-black-dragon", "name": "Young Black Dragon", "cr": "7", "page": 264,
                  "ac": 18, "hp": 127, "initiative": 5,
                  "scores": [19, 14, 17, 12, 11, 15], "saves": [4, 5, 3, 1, 3, 2],
                  "skills": {"perception": 6, "stealth": 5},
                  "movement": {"walk_ft": 40, "fly_ft": 80, "swim_ft": 40},
                  "traits": ["Amphibious"], "immunity": "acid", "condition_immunities": [],
                  "attack_bonus": 7, "attack": [2, 4, 4], "rider": [1, 6, "acid"],
                  "breath": "Acid Breath", "save": "dexterity", "dc": 14,
                  "shape": "line", "length": 30, "width": 5, "breath_dice": [14, 6, "acid"],
              },
              {
                  "slug": "young-blue-dragon", "name": "Young Blue Dragon", "cr": "9", "page": 266,
                  "ac": 18, "hp": 152, "initiative": 4,
                  "scores": [21, 10, 19, 14, 13, 17], "saves": [5, 4, 4, 2, 5, 3],
                  "skills": {"perception": 9, "stealth": 4},
                  "movement": {"walk_ft": 40, "burrow_ft": 20, "fly_ft": 80},
                  "traits": [], "immunity": "lightning", "condition_immunities": [],
                  "attack_bonus": 9, "attack": [2, 6, 5], "rider": [1, 10, "lightning"],
                  "breath": "Lightning Breath", "save": "dexterity", "dc": 16,
                  "shape": "line", "length": 60, "width": 5, "breath_dice": [10, 10, "lightning"],
              },
              {
                  "slug": "young-green-dragon", "name": "Young Green Dragon", "cr": "8", "page": 293,
                  "ac": 18, "hp": 136, "initiative": 4,
                  "scores": [19, 12, 17, 16, 13, 15], "saves": [4, 4, 3, 3, 4, 2],
                  "skills": {"deception": 5, "perception": 7, "stealth": 4},
                  "movement": {"walk_ft": 40, "fly_ft": 80, "swim_ft": 40},
                  "traits": ["Amphibious"], "immunity": "poison", "condition_immunities": ["poisoned"],
                  "attack_bonus": 7, "attack": [2, 6, 4], "rider": [2, 6, "poison"],
                  "breath": "Poison Breath", "save": "constitution", "dc": 14,
                  "shape": "cone", "length": 30, "width": None, "breath_dice": [12, 6, "poison"],
              },
              {
                  "slug": "young-red-dragon", "name": "Young Red Dragon", "cr": "10", "page": 318,
                  "ac": 18, "hp": 178, "initiative": 4,
                  "scores": [23, 10, 21, 14, 11, 19], "saves": [6, 4, 5, 2, 4, 4],
                  "skills": {"perception": 8, "stealth": 4},
                  "movement": {"walk_ft": 40, "climb_ft": 40, "fly_ft": 80},
                  "traits": [], "immunity": "fire", "condition_immunities": [],
                  "attack_bonus": 10, "attack": [2, 6, 6], "rider": [1, 6, "fire"],
                  "breath": "Fire Breath", "save": "dexterity", "dc": 17,
                  "shape": "cone", "length": 30, "width": None, "breath_dice": [16, 6, "fire"],
              },
              {
                  "slug": "young-white-dragon", "name": "Young White Dragon", "cr": "6", "page": 340,
                  "ac": 17, "hp": 123, "initiative": 3,
                  "scores": [18, 10, 18, 6, 11, 12], "saves": [4, 3, 4, -2, 3, 1],
                  "skills": {"perception": 6, "stealth": 3},
                  "movement": {"walk_ft": 40, "burrow_ft": 20, "fly_ft": 80, "swim_ft": 40},
                  "traits": ["Ice Walk"], "immunity": "cold", "condition_immunities": [],
                  "attack_bonus": 7, "attack": [2, 4, 4], "rider": [1, 4, "cold"],
                  "breath": "Cold Breath", "save": "constitution", "dc": 15,
                  "shape": "cone", "length": 30, "width": None, "breath_dice": [9, 8, "cold"],
              },
          ]

          def row_for(spec):
              try:
                  attack_count, attack_size, attack_bonus = spec["attack"]
                  rider_count, rider_size, rider_type = spec["rider"]
                  breath_count, breath_size, breath_type = spec["breath_dice"]
                  movement = {
                      "walk_ft": 0, "fly_ft": 0, "climb_ft": 0,
                      "swim_ft": 0, "burrow_ft": 0, "hover": False,
                  }
                  movement.update(spec["movement"])
                  area = {"shape": spec["shape"], "origin": "self", "length_ft": spec["length"]}
                  if spec["width"] is not None:
                      area["width_ft"] = spec["width"]
                  attack_id = f'{spec["slug"]}-rend'
                  breath_slug = spec["breath"].lower().replace(" ", "-")
                  breath_id = f'{spec["slug"]}-{breath_slug}'
                  resource_id = f'{breath_id}-recharge'
                  strength_mod = (spec["scores"][0] - 10) // 2
                  return {
                      "schema_version": 1,
                      "id": f'srd-{spec["slug"]}', "name": spec["name"],
                      "archetype": "source-certified young chromatic dragon",
                      "challenge_rating": spec["cr"], "kind": "monster", "size": "large",
                      "ability_scores": dict(zip(abilities, spec["scores"])),
                      "armor_class": spec["ac"], "max_hp": spec["hp"],
                      "speed_ft": max(spec["movement"].get("walk_ft", 0), spec["movement"].get("fly_ft", 0)),
                      "movement_modes": movement, "initiative_bonus": spec["initiative"],
                      "attacks": [{
                          "id": attack_id, "name": "Rend", "weapon_id": attack_id,
                          "attack_kind": "melee", "attack_bonus": spec["attack_bonus"],
                          "damage": {"count": attack_count, "size": attack_size, "bonus": attack_bonus},
                          "damage_type": "slashing", "animation": "claw", "reach_ft": 10,
                          "effects": [{
                              "kind": "damage", "source": rider_type.title(),
                              "dice": {"count": rider_count, "size": rider_size, "bonus": 0},
                              "damage_type": rider_type, "trigger": "on_hit", "mode": "add",
                          }],
                      }],
                      "primary_attack_id": attack_id,
                      "unarmed_opportunity_attack": {
                          "attack_bonus": spec["attack_bonus"], "damage": 1 + strength_mod,
                      },
                      "attack_action": {
                          "id": f'{spec["slug"]}-multiattack', "name": "Multiattack", "is_attack_action": False,
                          "slots": [
                              {"attack_ids": [attack_id], "save_action_ids": []},
                              {"attack_ids": [attack_id], "save_action_ids": []},
                              {"attack_ids": [attack_id], "save_action_ids": []},
                          ],
                      },
                      "save_actions": [{
                          "id": breath_id, "name": spec["breath"],
                          "save_ability": spec["save"], "dc": spec["dc"], "range_ft": 0,
                          "area": area,
                          "damage": {"count": breath_count, "size": breath_size, "bonus": 0},
                          "damage_type": breath_type, "success_damage": "half",
                          "resource_id": resource_id, "resource_cost": 1, "animation": breath_type,
                      }],
                      "saving_throw_bonuses": dict(zip(abilities, spec["saves"])),
                      "skill_bonuses": spec["skills"], "combat_traits": [],
                      "source_trait_names": spec["traits"], "source_reaction_names": [],
                      "source_bonus_action_names": [],
                      "source_limited_use_names": [f'actions:{spec["breath"]} (Recharge 5-6)'],
                      "source_legendary_action_names": [], "damage_immunities": [spec["immunity"]],
                      "condition_immunities": spec["condition_immunities"],
                      "resources": [{
                          "id": resource_id, "name": spec["breath"], "max_uses": 1,
                          "recharge": {"trigger": "start_of_turn", "die_size": 6, "minimum_roll": 5},
                      }],
                      "visual": {
                          "armor": "natural", "main_hand": "Rend",
                          "off_hand": spec["breath"], "body_style": "dragon",
                      },
                      "source": f'SRD 5.2.1 p. {spec["page"]}',
                  }
              except Exception:
                  logger.exception("Failed to build native row for %s", spec.get("name"))
                  raise

          try:
              path = Path("backend/app/content/data/combatant_capabilities_native_v1.json")
              rows = json.loads(path.read_text())
              existing = {row["id"] for row in rows}
              ids = {f'srd-{spec["slug"]}' for spec in specs}
              collisions = ids & existing
              if collisions:
                  raise RuntimeError(f"Young chromatic dragon ids already present: {sorted(collisions)}")
              rows.extend(row_for(spec) for spec in specs)
              path.write_text(json.dumps(rows, indent=2) + "\n")
              logger.info("Bound %d young chromatic dragons", len(specs))
          except Exception:
              logger.exception("Failed young chromatic dragon native binding")
              raise
          PY
      - name: Add source and runtime regressions
        run: |
          cat > backend/tests/test_young_chromatic_dragon_recharge_combat.py <<'PYTEST'
          import pytest

          from app.combat.dice import FixedDiceProvider
          from app.combat.encounter_combat_turn import resolve_combat_turn
          from app.combat.encounter_setup import build_encounter_setup
          from app.combat.resources import resource_state
          from app.content.capability_registry import build_combatant_from_capabilities
          from app.content.monster_catalog import load_monster_rows
          from app.content.monster_source_audit import audit_monster_source
          from app.domain.grid import GridPosition
          from app.domain.models import EncounterSelection


          CASES = [
              ("srd-young-black-dragon", "Young Black Dragon", "dexterity", 14, "line", 30, 5, 14, 6, "acid"),
              ("srd-young-blue-dragon", "Young Blue Dragon", "dexterity", 16, "line", 60, 5, 10, 10, "lightning"),
              ("srd-young-green-dragon", "Young Green Dragon", "constitution", 14, "cone", 30, None, 12, 6, "poison"),
              ("srd-young-red-dragon", "Young Red Dragon", "dexterity", 17, "cone", 30, None, 16, 6, "fire"),
              ("srd-young-white-dragon", "Young White Dragon", "constitution", 15, "cone", 30, None, 9, 8, "cold"),
          ]


          @pytest.mark.parametrize("template_id,name,ability,dc,shape,length,width,count,size,damage_type", CASES)
          def test_young_chromatic_dragon_bindings_match_srd(
              template_id, name, ability, dc, shape, length, width, count, size, damage_type,
          ) -> None:
              dragon = build_combatant_from_capabilities(template_id)
              row = next(row for row in load_monster_rows() if row["name"] == name)
              assert audit_monster_source(dragon, row) == []
              assert dragon.speed_ft == 80
              assert dragon.attack_action is not None
              assert len(dragon.attack_action.slots) == 3
              assert all(slot.attack_ids == [f"{template_id.removeprefix('srd-')}-rend"] for slot in dragon.attack_action.slots)
              breath = dragon.saving_throw_actions[0]
              assert (breath.save_ability, breath.dc, breath.success_damage) == (ability, dc, "half")
              assert breath.area is not None
              assert (breath.area.shape, breath.area.origin, breath.area.length_ft) == (shape, "self", length)
              assert breath.area.width_ft == width
              assert (breath.damage_dice_count, breath.damage_dice_size, breath.damage_type) == (count, size, damage_type)
              assert breath.resource_id is not None


          def test_young_black_dragon_line_breath_then_failed_recharge_falls_back_to_three_rends() -> None:
              setup = build_encounter_setup(EncounterSelection(
                  hero_ids=["karnok-stoneward-l1"], monster_ids=["srd-young-black-dragon"],
              ))
              hero, dragon = setup.heroes[0], setup.monsters[0]
              hero.state.position = GridPosition(x=0, y=6)
              dragon.state.position = GridPosition(x=1, y=6)
              hero.state.initiative_total = 10
              dragon.state.initiative_total = 20
              resource = resource_state(dragon.state, "young-black-dragon-acid-breath-recharge")
              assert resource.current_uses == 1

              first_turn, sequence = resolve_combat_turn(
                  1, 1, dragon, hero, setup, FixedDiceProvider([20] + [1] * 14),
              )
              saves = [event for event in first_turn if event.event_type == "saving_throw"]
              assert len(saves) == 1
              assert saves[0].feature_id == "young-black-dragon-acid-breath"
              assert resource.current_uses == 0

              second_turn, _ = resolve_combat_turn(
                  sequence, 2, dragon, hero, setup,
                  FixedDiceProvider([4] + [19, 1, 1, 1] * 3),
              )
              recharge = [event for event in second_turn if event.resource_roll is not None]
              assert len(recharge) == 1
              assert recharge[0].resource_roll.selected_roll == 4
              attacks = [event for event in second_turn if event.event_type == "attack"]
              assert [event.weapon_id for event in attacks] == ["young-black-dragon-rend"] * 3
          PYTEST
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Prove young chromatic dragons and shared Recharge areas
        working-directory: backend
        run: pytest -q tests/test_young_chromatic_dragon_recharge_combat.py tests/test_recharge_area_engine.py
      - name: Regenerate canonical artifacts
        run: |
          rm -rf backend/iron_pit_backend.egg-info
          python scripts/verify_certification_manifests.py --write
          python scripts/check_source_limits.py
      - name: Commit certified young chromatic dragons and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bind-young-chromatic-dragons-once.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: certify young chromatic dragon Recharge breaths"
          git push origin HEAD:feat/monster-recharge-v1
