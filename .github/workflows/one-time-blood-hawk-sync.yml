name: One-time Blood Hawk canonical sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: one-time-blood-hawk-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical static assets
        run: python scripts/prepare_static_site.py
      - name: Sync roster-order regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_arena_roster.py')
          text = path.read_text()
          old = '"srd-goblin-boss", "srd-bandit", "srd-commoner", "srd-guard", "srd-giant-rat", "srd-giant-weasel",'
          new = old + '\n        "srd-blood-hawk",'
          if old not in text:
              raise SystemExit('roster-order anchor drifted')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact generated assets and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-monsters-generated.js frontend/figure-profiles.js backend/tests/test_arena_roster.py
          git rm .github/workflows/one-time-blood-hawk-sync.yml
          git commit -m "build: sync Blood Hawk canonical browser assets"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
