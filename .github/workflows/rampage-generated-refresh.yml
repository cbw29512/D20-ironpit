name: Rampage Generated Artifact Refresh

on:
  push:
    branches:
      - fix/2014-rampage-bonus-attack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rampage-generated-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/2014-rampage-bonus-attack
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate authoritative generated artifacts
        run: |
          python scripts/export_runtime_monster_capabilities.py
          python scripts/export_browser_heroes.py
          python scripts/prepare_static_site.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit generator output
        run: |
          git config user.name "iron-pit-certification"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/content/data/combatant_capabilities_v1.json
          git add frontend/browser-heroes.js
          git add frontend/browser-monsters-generated.js
          git add frontend/browser-monsters-2014.js
          git add frontend/browser-spell-effects.js
          git add frontend/data/srd_5_2_1_monsters.json
          git add data/hero_certification_manifest.json data/monster_certification_manifest.json
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
          else
            git commit -m "Regenerate Rampage certification artifacts"
            git push origin HEAD:fix/2014-rampage-bonus-attack
          fi
