name: One-time certified monster sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: one-time-certified-monster-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Align 90-monster certification contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          catalog_test = Path('backend/tests/test_full_content_catalog.py')
          text = catalog_test.read_text(encoding='utf-8')
          replacements = {
              'assert len(ready_monsters) == 85': 'assert len(ready_monsters) == 90',
              '"Awakened Shrub": "srd-awakened-shrub", "Axe Beak": "srd-axe-beak",':
                  '"Awakened Shrub": "srd-awakened-shrub", "Awakened Tree": "srd-awakened-tree", "Axe Beak": "srd-axe-beak",',
              '"Flying Snake": "srd-flying-snake", "Frog": "srd-frog",':
                  '"Flying Snake": "srd-flying-snake", "Frog": "srd-frog", "Gargoyle": "srd-gargoyle",',
              '"Goblin Warrior": "srd-goblin-warrior", "Guard": "srd-guard", "Hawk": "srd-hawk",':
                  '"Goblin Warrior": "srd-goblin-warrior", "Grimlock": "srd-grimlock", "Guard": "srd-guard",\n        "Guard Captain": "srd-guard-captain", "Hawk": "srd-hawk",',
              '"Vulture": "srd-vulture", "Warhorse": "srd-warhorse", "Warrior Infantry": "srd-warrior-infantry",':
                  '"Violet Fungus": "srd-violet-fungus", "Vulture": "srd-vulture", "Warhorse": "srd-warhorse", "Warrior Infantry": "srd-warrior-infantry",',
          }
          for old, new in replacements.items():
              if old not in text and new not in text:
                  raise RuntimeError(f'Catalog test certification contract drifted: {old}')
              text = text.replace(old, new, 1)
          catalog_test.write_text(text, encoding='utf-8')

          browser_test = Path('frontend/browser-generated-monsters.test.cjs')
          text = browser_test.read_text(encoding='utf-8')
          text = text.replace(
              'assert.equal(Object.keys(generated).length, 85, "Generated runtime must expose only currently RAW-certified monsters");',
              'assert.equal(Object.keys(generated).length, 90, "Generated runtime must expose only currently RAW-certified monsters");',
              1,
          )
          anchor = '  "srd-animated-armor", "srd-animated-flying-sword", "srd-flying-snake", "srd-hippopotamus",'
          expanded = (
              '  "srd-animated-armor", "srd-animated-flying-sword", "srd-awakened-tree", "srd-flying-snake",\n'
              '  "srd-gargoyle", "srd-grimlock", "srd-guard-captain", "srd-hippopotamus",'
          )
          if anchor not in text and '"srd-awakened-tree"' not in text:
              raise RuntimeError('Browser generated-monster ID contract drifted.')
          text = text.replace(anchor, expanded, 1)
          tail = '  "srd-tough", "srd-venomous-snake",'
          tail_expanded = '  "srd-tough", "srd-venomous-snake", "srd-violet-fungus",'
          if tail not in text and '"srd-violet-fungus"' not in text:
              raise RuntimeError('Browser generated-monster tail contract drifted.')
          text = text.replace(tail, tail_expanded, 1)
          browser_test.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '85 monster templates are currently certified runnable in the browser combat engine.'
          new = '90 monster templates are currently certified runnable in the browser combat engine.'
          if old not in text and new not in text:
              raise RuntimeError('README certified-monster count drifted.')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate canonical static assets
        run: python scripts/prepare_static_site.py
      - name: Commit certification contracts and generated assets
        run: |
          if [ -n "$(git status --porcelain -- backend/tests/test_full_content_catalog.py frontend/browser-generated-monsters.test.cjs README.md frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json frontend/figure-profiles.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/tests/test_full_content_catalog.py frontend/browser-generated-monsters.test.cjs README.md frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json frontend/figure-profiles.js
            git commit -m "test: certify five zero-engine monsters RAW ready"
            git push origin HEAD:audit/raw-combat-log-figures-20260830
          fi
