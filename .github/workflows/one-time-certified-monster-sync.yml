name: One-time certified monster sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical static assets
        run: python scripts/prepare_static_site.py
      - name: Commit generated certified monster assets
        run: |
          if ! git diff --quiet -- frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json frontend/figure-profiles.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json frontend/figure-profiles.js
            git commit -m "build: regenerate certified monster assets"
            git push origin HEAD:audit/raw-combat-log-figures-20260830
          fi
