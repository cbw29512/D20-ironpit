name: Diagnose Python Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: read

concurrency:
  group: diagnose-python-once
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Capture full pytest output
        working-directory: backend
        shell: bash
        run: |
          set +e
          pytest -q > ../pytest-diagnostic.log 2>&1
          status=$?
          echo "$status" > ../pytest-diagnostic.exit
          echo "pytest exit code: $status"
          exit 0
      - name: Upload pytest diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostic-${{ github.sha }}
          path: |
            pytest-diagnostic.log
            pytest-diagnostic.exit
          retention-days: 1
