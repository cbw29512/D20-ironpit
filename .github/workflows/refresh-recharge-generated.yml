name: Refresh Recharge Generated Outputs

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

jobs:
  refresh-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical outputs
        run: |
          python scripts/verify_certification_manifests.py --write
          python scripts/prepare_static_site.py
      - name: Commit generated parity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/hero_certification_manifest.json \
            data/monster_certification_manifest.json \
            frontend/browser-heroes.js \
            frontend/browser-monsters-generated.js \
            frontend/browser-spell-effects.js \
            frontend/data/srd_5_2_1_monsters.json
          if git diff --cached --quiet; then
            echo "Generated outputs are already current."
            exit 0
          fi
          git commit -m "build: refresh Recharge certification artifacts"
          git push origin HEAD:feat/monster-recharge-v1
