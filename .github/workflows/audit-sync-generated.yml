name: One-shot 2014 Audit Generated Sync

on:
  push:
    branches: [audit/2014-closure-current-main]

permissions:
  contents: write

concurrency:
  group: audit-2014-generated-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/2014-closure-current-main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate authoritative hero artifact
        run: python scripts/export_browser_heroes.py
      - name: Commit only generator-owned hero artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js
          if git diff --cached --quiet; then
            echo "Generated hero artifact already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: sync generated 2014 audit hero artifact"
          git push origin HEAD:audit/2014-closure-current-main
