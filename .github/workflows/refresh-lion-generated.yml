name: Refresh Lion Generated Artifacts

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate canonical outputs
        run: |
          rm -rf backend/iron_pit_backend.egg-info
          python scripts/export_runtime_monster_capabilities.py
          python scripts/export_browser_heroes.py
          python scripts/export_browser_monsters.py
          python scripts/export_figure_profiles.py
          python scripts/verify_certification_manifests.py --write
          python scripts/export_roster_mechanic_checklist.py
      - name: Commit generator-owned outputs
        run: |
          outputs="backend/app/content/data/combatant_capabilities_v1.json frontend/browser-heroes.js frontend/browser-monsters-generated.js frontend/figure-profiles.js data/hero_certification_manifest.json data/monster_certification_manifest.json data/roster_combat_mechanics_v1.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $outputs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh Lion certification artifacts"
          git push origin HEAD:feat/monster-recharge-v1
