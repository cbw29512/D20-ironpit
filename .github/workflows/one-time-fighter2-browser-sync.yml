name: One-time Fighter 2 browser sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Generate certified browser heroes
        run: python scripts/prepare_static_site.py
      - name: Commit Fighter 2 browser hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-heroes.js
          git diff --cached --quiet && { echo "Expected browser hero regeneration produced no diff."; exit 1; }
          git commit -m "build: export certified Karnok Fighter 2"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
