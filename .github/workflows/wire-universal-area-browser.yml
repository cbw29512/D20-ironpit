name: Wire universal area browser modules

on:
  push:
    paths:
      - .github/workflows/wire-universal-area-browser.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
      - name: Wire production script order
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ("index.html", "frontend/index.html"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              area = '<script src="browser-spell-area.js"></script>'
              wired_area = (
                  '<script src="browser-grid-geometry.js"></script>'
                  '<script src="browser-area-shapes.js"></script>'
                  '<script src="browser-area-targeting.js"></script>'
                  '<script src="browser-spell-area.js"></script>'
              )
              saves = '<script src="browser-spell-resolution.js"></script>'
              wired_saves = '<script src="browser-save-targets.js"></script><script src="browser-spell-resolution.js"></script>'
              if area not in text or saves not in text:
                  raise SystemExit(f"Expected browser script anchors missing from {name}")
              text = text.replace(area, wired_area, 1).replace(saves, wired_saves, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m "engine: wire universal area browser modules"
          git push origin HEAD:feat/monster-recharge-v1
