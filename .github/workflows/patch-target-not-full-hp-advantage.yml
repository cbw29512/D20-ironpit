name: Patch Target-Not-Full-HP Advantage

on:
  push:
    branches:
      - feat/target-not-full-hp-advantage

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply state-first conditional attack advantage tranche
        run: |
          python - <<'PY'
          import logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("target_not_full_hp_patch")

          def replace_once(path: str, old: str, new: str) -> None:
              try:
                  file_path = Path(path)
                  content = file_path.read_text(encoding="utf-8")
                  count = content.count(old)
                  if count != 1:
                      raise RuntimeError(f"{path}: expected one exact replacement target, found {count}")
                  file_path.write_text(content.replace(old, new), encoding="utf-8")
                  logger.info("Patched %s", path)
              except Exception:
                  logger.exception("Failed exact replacement in %s", path)
                  raise

          def write(path: str, content: str) -> None:
              try:
                  Path(path).write_text(content, encoding="utf-8")
                  logger.info("Wrote %s", path)
              except Exception:
                  logger.exception("Failed writing %s", path)
                  raise

          replace_once(
              "backend/app/domain/weapons.py",
              '''class OnHitDamage(BaseModel):\n''',
              '''class ConditionalAttackAdvantage(BaseModel):\n    trigger: Literal["target_not_full_hp"]\n\n\nclass OnHitDamage(BaseModel):\n''',
          )
          replace_once(
              "backend/app/domain/weapons.py",
              '''    conditional_damage: list[ConditionalDamage] = Field(default_factory=list)\n    on_hit_damage: list[OnHitDamage] = Field(default_factory=list)\n''',
              '''    conditional_damage: list[ConditionalDamage] = Field(default_factory=list)\n    conditional_attack_advantage: list[ConditionalAttackAdvantage] = Field(default_factory=list)\n    on_hit_damage: list[OnHitDamage] = Field(default_factory=list)\n''',
          )
          replace_once(
              "backend/app/domain/combatants.py",
              '''    ConditionalDamage,\n    DamageType,\n''',
              '''    ConditionalAttackAdvantage,\n    ConditionalDamage,\n    DamageType,\n''',
          )
          replace_once(
              "backend/app/domain/models.py",
              '''    CombatantTemplate,\n    ConditionalDamage,\n''',
              '''    CombatantTemplate,\n    ConditionalAttackAdvantage,\n    ConditionalDamage,\n''',
          )
          replace_once(
              "backend/app/domain/models.py",
              '''    "CombatantTemplate",\n    "ConditionRemovalAction",\n    "ConditionalDamage",\n''',
              '''    "CombatantTemplate",\n    "ConditionRemovalAction",\n    "ConditionalAttackAdvantage",\n    "ConditionalDamage",\n''',
          )

          write(
              "backend/app/combat/conditional_attack_advantage.py",
              '''from __future__ import annotations\n\nimport logging\n\nfrom app.combat.hit_points import effective_max_hp\nfrom app.domain.models import CombatantState, WeaponAttack\n\nlogger = logging.getLogger(__name__)\n\n\ndef conditional_attack_advantage_sources(attack: WeaponAttack, target: CombatantState) -> int:\n    \"\"\"Return declarative attack-roll Advantage sources satisfied by target state.\"\"\"\n    try:\n        total = 0\n        for spec in attack.conditional_attack_advantage:\n            if spec.trigger == \"target_not_full_hp\":\n                total += int(target.current_hp < effective_max_hp(target))\n                continue\n            raise ValueError(f\"Unsupported conditional attack Advantage trigger: {spec.trigger!r}.\")\n        return total\n    except Exception:\n        logger.exception(\"Failed to evaluate conditional attack Advantage for %s.\", attack.id)\n        raise\n''',
          )
          replace_once(
              "backend/app/combat/attacks.py",
              '''from app.combat.conditions import apply_hit_conditions, attack_roll_condition_sources\n''',
              '''from app.combat.conditions import apply_hit_conditions, attack_roll_condition_sources\nfrom app.combat.conditional_attack_advantage import conditional_attack_advantage_sources\n''',
          )
          replace_once(
              "backend/app/combat/attacks.py",
              '''                               + reckless_attack_advantage(attacker, attack)\n                               + next_attack_against_advantage_sources(attacker, defender_event_id)),\n''',
              '''                               + reckless_attack_advantage(attacker, attack)\n                               + conditional_attack_advantage_sources(attack, defender)\n                               + next_attack_against_advantage_sources(attacker, defender_event_id)),\n''',
          )

          write(
              "frontend/browser-attack-advantage.js",
              '''(() => {\n  "use strict";\n  function sources(attack, target) {\n    try {\n      let total = 0;\n      for (const spec of attack.conditionalAttackAdvantage || []) {\n        if (spec.trigger === "target_not_full_hp") { total += target.current_hp < target.template.max_hp ? 1 : 0; continue; }\n        throw new Error(`Unsupported conditional attack Advantage trigger: ${spec.trigger}`);\n      }\n      return total;\n    } catch (error) { console.error("Conditional attack Advantage resolution failed.", error); throw error; }\n  }\n  window.IRON_PIT_BROWSER_ATTACK_ADVANTAGE = { sources };\n})();\n''',
          )
          replace_once(
              "frontend/browser-attack.js",
              '''  const S = () => window.IRON_PIT_BROWSER_STATE, R = () => window.IRON_PIT_BROWSER_ROLLS;\n''',
              '''  const S = () => window.IRON_PIT_BROWSER_STATE, R = () => window.IRON_PIT_BROWSER_ROLLS, A = () => window.IRON_PIT_BROWSER_ATTACK_ADVANTAGE || { sources: () => 0 };\n''',
          )
          replace_once(
              "frontend/browser-attack.js",
              '''    const advantage = (extra.advantage || 0) + conditions.advantage + bloodiedFury(attacker.state, attack)\n      + B2().attackAdvantage(attacker.state, attack) + M().nextAttackAgainstAdvantage(attacker.state, target.combatant_id);\n''',
              '''    const advantage = (extra.advantage || 0) + conditions.advantage + bloodiedFury(attacker.state, attack)\n      + B2().attackAdvantage(attacker.state, attack) + A().sources(attack, target.state) + M().nextAttackAgainstAdvantage(attacker.state, target.combatant_id);\n''',
          )
          replace_once(
              "scripts/browser_template_serializer.py",
              '''        if attack.on_hit_damage:\n''',
              '''        if attack.conditional_attack_advantage:\n            row["conditionalAttackAdvantage"] = [\n                {"trigger": spec.trigger} for spec in attack.conditional_attack_advantage\n            ]\n        if attack.on_hit_damage:\n''',
          )

          for html in ("index.html", "frontend/index.html"):
              replace_once(
                  html,
                  '''<script src="browser-attack.js"></script>''',
                  '''<script src="browser-attack-advantage.js"></script>\n  <script src="browser-attack.js"></script>''',
              )

          replace_once(
              "scripts/report_zero_engine_monsters.py",
              '''_ATTACK_ROLL = re.compile(r"\\b(?:Melee|Ranged|Melee or Ranged)\\s+Attack Roll:", re.I)\n''',
              '''_ATTACK_ROLL = re.compile(r"\\b(?:Melee|Ranged|Melee or Ranged)\\s+Attack Roll:", re.I)\n_CONDITIONAL_ATTACK_ADVANTAGE = re.compile(r"\\bwith Advantage if the target (?:doesn['’]t|does not) have all its Hit Points\\b", re.I)\n''',
          )
          replace_once(
              "scripts/report_zero_engine_monsters.py",
              '''    if _unmodeled_action_rider(actions):\n        blockers.append("unsupported-action-rider")\n''',
              '''    if _unmodeled_action_rider(actions):\n        blockers.append("unsupported-action-rider")\n    if _CONDITIONAL_ATTACK_ADVANTAGE.search(actions):\n        blockers.append("conditional-attack-advantage")\n''',
          )

          write(
              "backend/tests/test_conditional_attack_advantage.py",
              '''from __future__ import annotations\n\nimport logging\n\nfrom app.combat.conditional_attack_advantage import conditional_attack_advantage_sources\nfrom app.combat.state import build_combatant_state\nfrom app.content.monsters import build_goblin_warrior\nfrom app.domain.models import ConditionalAttackAdvantage\n\nlogger = logging.getLogger(__name__)\n\n\ndef test_target_not_full_hp_advantage_uses_current_target_hp() -> None:\n    try:\n        target = build_combatant_state(build_goblin_warrior())\n        attack = target.template.weapon_attack.model_copy(update={\n            "conditional_attack_advantage": [ConditionalAttackAdvantage(trigger="target_not_full_hp")],\n        })\n        assert conditional_attack_advantage_sources(attack, target) == 0\n        target.current_hp -= 1\n        assert conditional_attack_advantage_sources(attack, target) == 1\n    except Exception:\n        logger.exception("Target-not-full-HP Advantage regression failed.")\n        raise\n''',
          )
          write(
              "frontend/browser-attack-advantage.test.cjs",
              '''const assert = require("node:assert/strict");\nconst fs = require("node:fs");\nconst vm = require("node:vm");\n\nglobal.window = {};\nvm.runInThisContext(fs.readFileSync(require.resolve("./browser-attack-advantage.js"), "utf8"), { filename: "browser-attack-advantage.js" });\n\nconst attack = { conditionalAttackAdvantage: [{ trigger: "target_not_full_hp" }] };\nconst target = (hp) => ({ current_hp: hp, template: { max_hp: 20 } });\nassert.equal(window.IRON_PIT_BROWSER_ATTACK_ADVANTAGE.sources(attack, target(20)), 0);\nassert.equal(window.IRON_PIT_BROWSER_ATTACK_ADVANTAGE.sources(attack, target(19)), 1);\nassert.throws(() => window.IRON_PIT_BROWSER_ATTACK_ADVANTAGE.sources({ conditionalAttackAdvantage: [{ trigger: "bad" }] }, target(19)));\nconsole.log("Browser target-not-full-HP conditional attack Advantage regressions passed.");\n''',
          )
          logger.info("Applied target-not-full-HP conditional Advantage schema/runtime tranche.")
          PY
      - name: Verify source limits and targeted tests
        run: |
          pip install -e './backend[dev]'
          python scripts/check_source_limits.py
          cd backend && pytest -q tests/test_conditional_attack_advantage.py && cd ..
          node frontend/browser-attack-advantage.test.cjs
          node --check frontend/browser-attack-advantage.js
          node --check frontend/browser-attack.js
      - name: Commit code tranche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/domain/weapons.py backend/app/domain/combatants.py backend/app/domain/models.py backend/app/combat/conditional_attack_advantage.py backend/app/combat/attacks.py backend/tests/test_conditional_attack_advantage.py frontend/browser-attack-advantage.js frontend/browser-attack.js frontend/browser-attack-advantage.test.cjs scripts/browser_template_serializer.py scripts/report_zero_engine_monsters.py index.html frontend/index.html
          git diff --cached --check
          git commit -m "feat: add target-not-full-hp attack Advantage"
          git push origin HEAD:${{ github.ref_name }}
