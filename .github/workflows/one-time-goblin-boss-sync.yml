name: One-time Goblin Boss canonical sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: one-time-goblin-boss-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical static assets
        run: python scripts/prepare_static_site.py
      - name: Commit exact generated assets and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/browser-monsters-generated.js frontend/figure-profiles.js frontend/browser-heroes.js frontend/data/srd_5_2_1_monsters.json
          git rm .github/workflows/one-time-goblin-boss-sync.yml
          git commit -m "build: sync Goblin Boss canonical browser assets"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
