name: Promote Warlock Generated Artifacts

on:
  push:
    branches:
      - feat/usable-roster-warlock-l1

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message != 'chore: promote generated Warlock artifacts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/usable-roster-warlock-l1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical artifacts
        run: |
          python scripts/export_browser_heroes.py
          python scripts/verify_certification_manifests.py --write
          python scripts/prepare_static_site.py
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/hero_certification_manifest.json data/monster_certification_manifest.json frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          if git diff --cached --quiet; then
            echo 'No generated changes to promote.'
            exit 0
          fi
          git commit -m 'chore: promote generated Warlock artifacts'
          git push origin HEAD:feat/usable-roster-warlock-l1
