name: Browser Harness Dependencies

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-harness-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit all browser test harness dependencies
        run: python scripts/check_browser_harness_dependencies.py
