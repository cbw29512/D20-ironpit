name: One-time canonical hero sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update canonical hero contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_full_content_catalog.py')
          text = path.read_text()
          replacements = {
              'def test_catalog_contains_three_builds_for_every_core_class_level() -> None:': 'def test_catalog_contains_one_canonical_hero_for_every_class_level() -> None:',
              'assert catalog.hero_count == 720': 'assert catalog.hero_count == 240',
              'assert len(catalog.heroes) == 720': 'assert len(catalog.heroes) == 240',
              'assert len({card.id for card in catalog.heroes}) == 720': 'assert len({card.id for card in catalog.heroes}) == 240',
              'assert set(counts.values()) == {60}': 'assert set(counts.values()) == {20}',
              '            assert len(level_cards) == 3\n            assert len({card.build_id for card in level_cards}) == 3': '            assert len(level_cards) == 1\n            assert {card.build_id for card in level_cards} == {"canonical"}',
              'and card.level == 20 and card.build_id == "great-weapon"': 'and card.level == 20 and card.build_id == "canonical"',
              '("barbarian", 1, "great-weapon", "Rokhan Stonefury", "rokhan-stonefury-l1")': '("barbarian", 1, "canonical", "Rokhan Stonefury", "rokhan-stonefury-l1")',
              '("fighter", 1, "great-weapon", "Karnok Stoneward", "karnok-stoneward-l1")': '("fighter", 1, "canonical", "Karnok Stoneward", "karnok-stoneward-l1")',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected test contract: {old}')
              text = text.replace(old, new)
          path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
              'The hero catalog contains 720 planned cards across the 12 core classes, levels 1–20, and three build slots per level. Only explicitly audited builds are runnable; the current RAW-ready browser heroes are the level-1 Fighter and Barbarian builds.',
              'The hero catalog contains 240 level snapshots across 12 persistent named heroes, one per core class, each progressing from level 1–20. Only explicitly audited levels are runnable; the current RAW-ready browser heroes are Karnok Stoneward (Fighter 1) and Rokhan Stonefury (Barbarian 1).',
          )
          text = text.replace(
              '**Hero slot:** click the slot, then choose Class → Level → Pregen / Build. All 12 classes and levels 1–20 are represented in the catalog; uncertified combinations remain unavailable for automated combat rather than being approximated.',
              '**Hero slot:** click the slot, choose one of the 12 persistent heroes, then choose Level 1–20. Uncertified hero levels remain unavailable for automated combat rather than being approximated.',
          )
          readme.write_text(text)
          PY
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical browser assets
        run: python scripts/prepare_static_site.py
      - name: Commit canonical hero migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_full_content_catalog.py README.md frontend/browser-heroes.js
          git commit -m "build: sync canonical hero progression catalog"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
