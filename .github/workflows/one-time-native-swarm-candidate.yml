name: One-time native swarm candidate gate

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: read

concurrency:
  group: native-swarm-candidate-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce source limits and generated legacy snapshot
        run: |
          python scripts/check_source_limits.py
          python scripts/export_runtime_monster_capabilities.py --check
      - name: Certify native capability registry and source parity
        working-directory: backend
        run: |
          pytest -q \
            tests/test_native_capability_monsters.py \
            tests/test_capability_registry.py \
            tests/test_capability_roundtrip.py
