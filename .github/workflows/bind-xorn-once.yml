name: Bind Xorn Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind Xorn declaratively
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('backend/app/content/data/combatant_capabilities_native_v1.json')
          rows = json.loads(path.read_text())
          assert not any(row['id'] == 'srd-xorn' for row in rows)
          rows.append({
            'schema_version': 1,
            'id': 'srd-xorn',
            'name': 'Xorn',
            'archetype': 'source-certified elemental',
            'challenge_rating': '5',
            'kind': 'monster',
            'size': 'medium',
            'ability_scores': {'strength': 17, 'dexterity': 10, 'constitution': 22, 'intelligence': 11, 'wisdom': 10, 'charisma': 11},
            'armor_class': 19,
            'max_hp': 84,
            'speed_ft': 20,
            'movement_modes': {'walk_ft': 20, 'fly_ft': 0, 'climb_ft': 0, 'swim_ft': 0, 'burrow_ft': 20, 'hover': False},
            'initiative_bonus': 0,
            'attacks': [
              {'id': 'xorn-bite', 'name': 'Bite', 'weapon_id': 'xorn-bite', 'attack_kind': 'melee', 'attack_bonus': 6,
               'damage': {'count': 4, 'size': 6, 'bonus': 3}, 'damage_type': 'piercing', 'animation': 'bite', 'reach_ft': 5},
              {'id': 'xorn-claw', 'name': 'Claw', 'weapon_id': 'xorn-claw', 'attack_kind': 'melee', 'attack_bonus': 6,
               'damage': {'count': 1, 'size': 10, 'bonus': 3}, 'damage_type': 'slashing', 'animation': 'slash', 'reach_ft': 5}
            ],
            'primary_attack_id': 'xorn-bite',
            'unarmed_opportunity_attack': {'attack_bonus': 6, 'damage': 4},
            'attack_action': {
              'id': 'xorn-multiattack', 'name': 'Multiattack', 'is_attack_action': False,
              'slots': [
                {'attack_ids': ['xorn-bite'], 'save_action_ids': []},
                {'attack_ids': ['xorn-claw'], 'save_action_ids': []},
                {'attack_ids': ['xorn-claw'], 'save_action_ids': []},
                {'attack_ids': ['xorn-claw'], 'save_action_ids': []}
              ]
            },
            'saving_throw_bonuses': {'strength': 3, 'dexterity': 0, 'constitution': 6, 'intelligence': 0, 'wisdom': 0, 'charisma': 0},
            'skill_bonuses': {'perception': 6, 'stealth': 6},
            'source_trait_names': ['Earth Glide', 'Treasure Sense'],
            'source_reaction_names': [],
            'source_bonus_action_names': ['Charge'],
            'source_limited_use_names': [],
            'source_legendary_action_names': [],
            'damage_immunities': ['poison'],
            'condition_immunities': ['paralyzed', 'petrified', 'poisoned'],
            'visual': {'armor': 'none', 'main_hand': 'Claw', 'off_hand': 'Bite', 'body_style': 'elemental'},
            'source': 'SRD 5.2.1 p. 343'
          })
          path.write_text(json.dumps(rows, indent=2) + '\n')

          figures = Path('backend/app/content/figure_profiles.py')
          text = figures.read_text()
          anchor = '    "Wyvern": _p("reptile", "wyvern"),\n'
          assert anchor in text and '"Xorn"' not in text
          figures.write_text(text.replace(anchor, anchor + '    "Xorn": _p("brute", "xorn"),\n'))
          PY
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Regenerate canonical artifacts
        run: |
          rm -rf backend/iron_pit_backend.egg-info
          python scripts/verify_certification_manifests.py --write
          python scripts/export_figure_profiles.py
      - name: Commit generated Xorn and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bind-xorn-once.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: certify Xorn with flat-arena trait semantics"
          git push origin HEAD:feat/monster-recharge-v1
