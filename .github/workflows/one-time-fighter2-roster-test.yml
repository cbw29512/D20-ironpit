name: One-time Fighter 2 roster test sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - name: Add Karnok 2 to exact internal roster contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_arena_roster.py')
          text = path.read_text()
          old = '"karnok-stoneward-l1", "rokhan-stonefury-l1", "aldric-vane-l1",'
          new = '"karnok-stoneward-l1", "karnok-stoneward-l2", "rokhan-stonefury-l1", "aldric-vane-l1",'
          if old not in text:
              raise SystemExit('Expected roster contract was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit exact roster contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_arena_roster.py
          git commit -m "test: include staged Karnok Fighter 2 in arena roster"
          git push origin HEAD:audit/raw-combat-log-figures-20260830
