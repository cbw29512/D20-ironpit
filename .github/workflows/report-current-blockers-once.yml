name: Report Current Blockers Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: read

concurrency:
  group: report-current-blockers-once
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Build blocker yield report
        run: python scripts/report_capability_yield.py > blocker-yield.txt
      - name: Upload blocker yield report
        uses: actions/upload-artifact@v4
        with:
          name: blocker-yield-${{ github.sha }}
          path: blocker-yield.txt
          retention-days: 1
