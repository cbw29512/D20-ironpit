name: Bind Chromatic Wyrmlings Once

on:
  push:
    branches:
      - feat/monster-recharge-v1

permissions:
  contents: write

concurrency:
  group: bind-chromatic-wyrmlings-once
  cancel-in-progress: true

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/monster-recharge-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bind five chromatic wyrmlings declaratively
        run: |
          python - <<'PY'
          import json
          import logging
          from pathlib import Path

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("bind_chromatic_wyrmlings")

          SPECS = [
              {
                  "slug": "black-dragon-wyrmling", "name": "Black Dragon Wyrmling", "cr": "2",
                  "page": 263, "ac": 17, "hp": 33, "initiative": 4,
                  "abilities": [15, 14, 13, 10, 11, 13], "saves": [2, 4, 1, 0, 2, 1],
                  "skills": {"perception": 4, "stealth": 4},
                  "movement": {"walk_ft": 30, "fly_ft": 60, "swim_ft": 30},
                  "traits": ["Amphibious"], "immunity": "acid", "condition_immunities": [],
                  "attack_bonus": 4, "attack_dice": [1, 6, 2], "rider": [1, 4, "acid"],
                  "breath": "Acid Breath", "save": "dexterity", "dc": 11,
                  "shape": "line", "length": 15, "width": 5, "breath_dice": [5, 8, "acid"],
              },
              {
                  "slug": "blue-dragon-wyrmling", "name": "Blue Dragon Wyrmling", "cr": "3",
                  "page": 266, "ac": 17, "hp": 65, "initiative": 2,
                  "abilities": [17, 10, 15, 12, 11, 15], "saves": [3, 2, 2, 1, 2, 2],
                  "skills": {"perception": 4, "stealth": 2},
                  "movement": {"walk_ft": 30, "fly_ft": 60, "burrow_ft": 15},
                  "traits": [], "immunity": "lightning", "condition_immunities": [],
                  "attack_bonus": 5, "attack_dice": [1, 10, 3], "rider": [1, 6, "lightning"],
                  "breath": "Lightning Breath", "save": "dexterity", "dc": 12,
                  "shape": "line", "length": 30, "width": 5, "breath_dice": [6, 6, "lightning"],
              },
              {
                  "slug": "green-dragon-wyrmling", "name": "Green Dragon Wyrmling", "cr": "2",
                  "page": 293, "ac": 17, "hp": 38, "initiative": 3,
                  "abilities": [15, 12, 13, 14, 11, 13], "saves": [2, 3, 1, 2, 2, 1],
                  "skills": {"perception": 4, "stealth": 3},
                  "movement": {"walk_ft": 30, "fly_ft": 60, "swim_ft": 30},
                  "traits": ["Amphibious"], "immunity": "poison", "condition_immunities": ["poisoned"],
                  "attack_bonus": 4, "attack_dice": [1, 10, 2], "rider": [1, 6, "poison"],
                  "breath": "Poison Breath", "save": "constitution", "dc": 11,
                  "shape": "cone", "length": 15, "width": None, "breath_dice": [6, 6, "poison"],
              },
              {
                  "slug": "red-dragon-wyrmling", "name": "Red Dragon Wyrmling", "cr": "4",
                  "page": 318, "ac": 17, "hp": 75, "initiative": 2,
                  "abilities": [19, 10, 17, 12, 11, 15], "saves": [4, 2, 3, 1, 2, 2],
                  "skills": {"perception": 4, "stealth": 2},
                  "movement": {"walk_ft": 30, "fly_ft": 60, "climb_ft": 30},
                  "traits": [], "immunity": "fire", "condition_immunities": [],
                  "attack_bonus": 6, "attack_dice": [1, 10, 4], "rider": [1, 6, "fire"],
                  "breath": "Fire Breath", "save": "dexterity", "dc": 13,
                  "shape": "cone", "length": 15, "width": None, "breath_dice": [7, 6, "fire"],
              },
              {
                  "slug": "white-dragon-wyrmling", "name": "White Dragon Wyrmling", "cr": "2",
                  "page": 339, "ac": 16, "hp": 32, "initiative": 2,
                  "abilities": [14, 10, 14, 5, 10, 11], "saves": [2, 2, 2, -3, 2, 0],
                  "skills": {"perception": 4, "stealth": 2},
                  "movement": {"walk_ft": 30, "fly_ft": 60, "burrow_ft": 15, "swim_ft": 30},
                  "traits": ["Ice Walk"], "immunity": "cold", "condition_immunities": [],
                  "attack_bonus": 4, "attack_dice": [1, 8, 2], "rider": [1, 4, "cold"],
                  "breath": "Cold Breath", "save": "constitution", "dc": 12,
                  "shape": "cone", "length": 15, "width": None, "breath_dice": [5, 8, "cold"],
              },
          ]
          ABILITIES = ["strength", "dexterity", "constitution", "intelligence", "wisdom", "charisma"]

          def build_row(spec):
              try:
                  attack_count, attack_size, attack_mod = spec["attack_dice"]
                  rider_count, rider_size, rider_type = spec["rider"]
                  breath_count, breath_size, breath_type = spec["breath_dice"]
                  movement = {"walk_ft": 0, "fly_ft": 0, "climb_ft": 0, "swim_ft": 0, "burrow_ft": 0, "hover": False}
                  movement.update(spec["movement"])
                  area = {"shape": spec["shape"], "origin": "self", "length_ft": spec["length"]}
                  if spec["width"] is not None:
                      area["width_ft"] = spec["width"]
                  resource_id = f'{spec["slug"]}-{spec["breath"].lower().replace(" ", "-")}-recharge'
                  attack_id = f'{spec["slug"]}-rend'
                  breath_id = f'{spec["slug"]}-{spec["breath"].lower().replace(" ", "-")}'
                  strength_mod = (spec["abilities"][0] - 10) // 2
                  return {
                      "schema_version": 1, "id": f'srd-{spec["slug"]}', "name": spec["name"],
                      "archetype": "source-certified chromatic wyrmling", "challenge_rating": spec["cr"],
                      "kind": "monster", "size": "medium",
                      "ability_scores": dict(zip(ABILITIES, spec["abilities"])),
                      "armor_class": spec["ac"], "max_hp": spec["hp"], "speed_ft": spec["movement"]["walk_ft"],
                      "movement_modes": movement, "initiative_bonus": spec["initiative"],
                      "attacks": [{
                          "id": attack_id, "name": "Rend", "weapon_id": attack_id,
                          "attack_kind": "melee", "attack_bonus": spec["attack_bonus"],
                          "damage": {"count": attack_count, "size": attack_size, "bonus": attack_mod},
                          "damage_type": "slashing", "animation": "claw", "reach_ft": 5,
                          "effects": [{
                              "kind": "damage", "source": rider_type.title(),
                              "dice": {"count": rider_count, "size": rider_size, "bonus": 0},
                              "damage_type": rider_type, "trigger": "on_hit", "mode": "add",
                          }],
                      }],
                      "primary_attack_id": attack_id,
                      "unarmed_opportunity_attack": {"attack_bonus": spec["attack_bonus"], "damage": 1 + strength_mod},
                      "attack_action": {
                          "id": f'{spec["slug"]}-multiattack', "name": "Multiattack", "is_attack_action": False,
                          "slots": [
                              {"attack_ids": [attack_id], "save_action_ids": []},
                              {"attack_ids": [attack_id], "save_action_ids": []},
                          ],
                      },
                      "save_actions": [{
                          "id": breath_id, "name": spec["breath"], "save_ability": spec["save"], "dc": spec["dc"],
                          "range_ft": 0, "area": area,
                          "damage": {"count": breath_count, "size": breath_size, "bonus": 0},
                          "damage_type": breath_type, "success_damage": "half",
                          "resource_id": resource_id, "resource_cost": 1, "animation": breath_type,
                      }],
                      "saving_throw_bonuses": dict(zip(ABILITIES, spec["saves"])),
                      "skill_bonuses": spec["skills"], "combat_traits": [], "source_trait_names": spec["traits"],
                      "source_reaction_names": [], "source_bonus_action_names": [],
                      "source_limited_use_names": [f'actions:{spec["breath"]} (Recharge 5-6)'],
                      "source_legendary_action_names": [], "damage_immunities": [spec["immunity"]],
                      "condition_immunities": spec["condition_immunities"],
                      "resources": [{
                          "id": resource_id, "name": spec["breath"], "max_uses": 1,
                          "recharge": {"trigger": "start_of_turn", "die_size": 6, "minimum_roll": 5},
                      }],
                      "visual": {"armor": "natural", "main_hand": "Rend", "off_hand": spec["breath"], "body_style": "dragon"},
                      "source": f'SRD 5.2.1 p. {spec["page"]}',
                  }
              except Exception:
                  logger.exception("Failed to build native row for %s", spec.get("name"))
                  raise

          try:
              path = Path("backend/app/content/data/combatant_capabilities_native_v1.json")
              rows = json.loads(path.read_text())
              existing = {row["id"] for row in rows}
              expected = {f'srd-{spec["slug"]}' for spec in SPECS}
              collision = expected & existing
              if collision:
                  raise RuntimeError(f"Chromatic wyrmling ids already present: {sorted(collision)}")
              rows.extend(build_row(spec) for spec in SPECS)
              path.write_text(json.dumps(rows, indent=2) + "\n")
              logger.info("Bound %d chromatic wyrmlings", len(SPECS))
          except Exception:
              logger.exception("Failed chromatic wyrmling native binding")
              raise
          PY
      - name: Add source and runtime regressions
        run: |
          cat > backend/tests/test_chromatic_wyrmling_recharge_combat.py <<'PYTEST'
          import pytest

          from app.combat.dice import FixedDiceProvider
          from app.combat.encounter_combat_turn import resolve_combat_turn
          from app.combat.encounter_setup import build_encounter_setup
          from app.combat.resources import resource_state
          from app.content.capability_registry import build_combatant_from_capabilities
          from app.content.monster_catalog import load_monster_rows
          from app.content.monster_source_audit import audit_monster_source
          from app.domain.grid import GridPosition
          from app.domain.models import EncounterSelection


          CASES = [
              ("srd-black-dragon-wyrmling", "Black Dragon Wyrmling", "dexterity", 11, "line", 15, 5, 5, 8, "acid"),
              ("srd-blue-dragon-wyrmling", "Blue Dragon Wyrmling", "dexterity", 12, "line", 30, 5, 6, 6, "lightning"),
              ("srd-green-dragon-wyrmling", "Green Dragon Wyrmling", "constitution", 11, "cone", 15, None, 6, 6, "poison"),
              ("srd-red-dragon-wyrmling", "Red Dragon Wyrmling", "dexterity", 13, "cone", 15, None, 7, 6, "fire"),
              ("srd-white-dragon-wyrmling", "White Dragon Wyrmling", "constitution", 12, "cone", 15, None, 5, 8, "cold"),
          ]


          @pytest.mark.parametrize("template_id,name,ability,dc,shape,length,width,count,size,damage_type", CASES)
          def test_chromatic_wyrmling_bindings_match_srd(
              template_id, name, ability, dc, shape, length, width, count, size, damage_type,
          ) -> None:
              wyrmling = build_combatant_from_capabilities(template_id)
              row = next(row for row in load_monster_rows() if row["name"] == name)
              assert audit_monster_source(wyrmling, row) == []
              assert wyrmling.attack_action is not None
              assert len(wyrmling.attack_action.slots) == 2
              breath = wyrmling.saving_throw_actions[0]
              assert (breath.save_ability, breath.dc, breath.success_damage) == (ability, dc, "half")
              assert breath.area is not None
              assert (breath.area.shape, breath.area.origin, breath.area.length_ft) == (shape, "self", length)
              assert breath.area.width_ft == width
              assert (breath.damage_dice_count, breath.damage_dice_size, breath.damage_type) == (count, size, damage_type)
              assert breath.resource_id is not None


          def test_black_wyrmling_line_breath_then_failed_recharge_falls_back_to_two_rends() -> None:
              setup = build_encounter_setup(EncounterSelection(
                  hero_ids=["karnok-stoneward-l1"], monster_ids=["srd-black-dragon-wyrmling"],
              ))
              hero, dragon = setup.heroes[0], setup.monsters[0]
              hero.state.position = GridPosition(x=0, y=6)
              dragon.state.position = GridPosition(x=1, y=6)
              hero.state.initiative_total = 10
              dragon.state.initiative_total = 20
              resource = resource_state(dragon.state, "black-dragon-wyrmling-acid-breath-recharge")
              assert resource.current_uses == 1

              first_turn, sequence = resolve_combat_turn(
                  1, 1, dragon, hero, setup, FixedDiceProvider([20, 1, 1, 1, 1, 1]),
              )
              saves = [event for event in first_turn if event.event_type == "saving_throw"]
              assert len(saves) == 1 and saves[0].feature_id == "black-dragon-wyrmling-acid-breath"
              assert resource.current_uses == 0

              second_turn, _ = resolve_combat_turn(
                  sequence, 2, dragon, hero, setup,
                  FixedDiceProvider([4, 19, 1, 1, 19, 1, 1]),
              )
              recharge = [event for event in second_turn if event.resource_roll is not None]
              assert len(recharge) == 1 and recharge[0].resource_roll.selected_roll == 4
              attacks = [event for event in second_turn if event.event_type == "attack"]
              assert [event.weapon_id for event in attacks] == [
                  "black-dragon-wyrmling-rend", "black-dragon-wyrmling-rend",
              ]
          PYTEST
      - name: Install rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Prove chromatic wyrmlings and shared Recharge areas
        working-directory: backend
        run: pytest -q tests/test_chromatic_wyrmling_recharge_combat.py tests/test_recharge_area_engine.py
      - name: Regenerate canonical artifacts
        run: |
          rm -rf backend/iron_pit_backend.egg-info
          python scripts/verify_certification_manifests.py --write
          python scripts/check_source_limits.py
      - name: Commit certified chromatic wyrmlings and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bind-chromatic-wyrmlings-once.yml
          git add -A
          git diff --cached --check
          git commit -m "feat: certify chromatic wyrmling Recharge breaths"
          git push origin HEAD:feat/monster-recharge-v1
