name: One-shot Druid 1 checklist sync

on:
  push:
    branches:
      - feat/2024-druid-level1

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/2024-druid-level1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Refresh generated Druid 1 artifacts
        run: |
          python scripts/export_roster_mechanic_checklist.py
          python scripts/export_browser_heroes.py
          python scripts/verify_certification_manifests.py --write
      - name: Commit generated outputs and remove one-shot workflow
        run: |
          rm .github/workflows/sync-druid1-checklist-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster_combat_mechanics_v1.json frontend/browser-heroes.js data/hero_certification_manifest.json .github/workflows/sync-druid1-checklist-once.yml
          git diff --cached --check
          git commit -m "chore: refresh Druid 1 generated checklists"
          git push origin HEAD:feat/2024-druid-level1
