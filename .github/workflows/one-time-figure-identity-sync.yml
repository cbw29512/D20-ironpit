name: One-time figure identity sync

on:
  push:
    branches:
      - audit/raw-combat-log-figures-20260830

permissions:
  contents: write

concurrency:
  group: one-time-figure-identity-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/raw-combat-log-figures-20260830
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Add reviewed figure styling
        run: python scripts/append_promoted_figure_styles.py
      - name: Regenerate canonical figure profiles
        run: python scripts/prepare_static_site.py
      - name: Commit reviewed figure identities
        run: |
          if [ -n "$(git status --porcelain -- frontend/figure-archetypes.css frontend/figure-profiles.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add frontend/figure-archetypes.css frontend/figure-profiles.js
            git commit -m "feat: render five promoted monster identities"
            git push origin HEAD:audit/raw-combat-log-figures-20260830
          fi
