name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Exact-head certification for the universal combat engine and canonical SRD content.
jobs:
  combat-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'

      - name: Enforce production source limits
        run: python scripts/check_source_limits.py

      - name: Enforce combat capability coverage
        run: |
          python scripts/check_combat_engine_coverage.py
          python scripts/export_roster_mechanic_checklist.py --check

      - name: Enforce declarative monster source of truth
        run: |
          python scripts/export_runtime_monster_capabilities.py --check
          ! grep -Eq 'app\.content\.(legacy_monster_roster|monster_|monsters_)' backend/app/content/roster.py

      - name: Generate canonical hero artifact
        run: python scripts/export_browser_heroes.py

      - name: Upload canonical hero artifact
        uses: actions/upload-artifact@v4
        with:
          name: canonical-heroes-${{ github.sha }}
          path: frontend/browser-heroes.js
          retention-days: 1

      - name: Generate certification manifest candidates
        run: python scripts/verify_certification_manifests.py --write

      - name: Upload certification manifest candidates
        uses: actions/upload-artifact@v4
        with:
          name: certification-manifests-${{ github.sha }}
          path: |
            data/hero_certification_manifest.json
            data/monster_certification_manifest.json
          retention-days: 1

      - name: Enforce durable certification manifest parity
        run: |
          git diff --exit-code -- data/hero_certification_manifest.json data/monster_certification_manifest.json
          python scripts/report_certification_progress.py

      - name: Report monster blocker yields
        run: |
          python scripts/report_zero_engine_monsters.py
          python scripts/report_capability_yield.py

      - name: Prepare static browser package
        run: |
          python scripts/prepare_static_site.py
          test -s frontend/data/srd_5_2_1_monsters.json
          test -s frontend/browser-monsters-generated.js
          test -s frontend/browser-spell-effects.js
          grep -q '"id":"bless"' frontend/browser-spell-effects.js

      - name: Upload canonical static artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-static-${{ github.sha }}
          path: |
            frontend/browser-heroes.js
            frontend/browser-monsters-generated.js
            frontend/browser-spell-effects.js
            frontend/data/srd_5_2_1_monsters.json
          retention-days: 1

      - name: Enforce generated static parity
        run: |
          git diff --exit-code -- frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json
          test -z "$(git status --porcelain --untracked-files=all -- frontend/browser-monsters-generated.js frontend/browser-spell-effects.js frontend/data/srd_5_2_1_monsters.json)"

      - name: Certify Python rules reference
        working-directory: backend
        run: pytest -q

      - name: Validate browser JavaScript syntax
        run: |
          for file in frontend/*.js; do node --check "$file"; done

      - name: Run every browser combat regression
        run: |
          set -euo pipefail
          count=0
          for test_file in frontend/*.test.cjs; do
            echo "Running $test_file"
            node "$test_file"
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Ran $count browser regression files."

      - name: Enforce canonical monster browser source of truth
        run: |
          legacy='browser-monsters\.js|browser-monsters-fixed\.js|browser-monsters-beast2\.js|browser-monsters-batch3\.js|browser-monsters-control\.js|browser-monsters-poison\.js|browser-monsters-venom\.js|browser-monsters-mixed\.js|browser-monsters-expansion\.js'
          grep -q 'browser-monsters-generated.js' frontend/index.html
          grep -q 'browser-monsters-generated.js' index.html
          ! grep -Eq "$legacy" frontend/index.html
          ! grep -Eq "$legacy" index.html
          if grep -nE "$legacy" frontend/*.test.cjs; then
            echo "Legacy monster fixture packs remain referenced by browser tests." >&2
            exit 1
          fi
          grep -q 'IRON_PIT_CANONICAL_MONSTERS_READY' frontend/app.js

      - name: Prove production fight path is backend-free
        run: |
          ! grep -R -q 'IRON_PIT_API_BASE' frontend scripts
          ! grep -q '/api/' frontend/app.js frontend/browser-execution.js
          ! grep -q 'createSeededDice' frontend/app.js frontend/battle-lab.js frontend/browser-execution.js
          ! grep -q 'window.IRON_PIT_DICE[[:space:]]*=' frontend/app.js frontend/browser-execution.js
          ! grep -Eq 'runEncounter|IRON_PIT_DICE' frontend/browser-audit.js
          ! test -e render.yaml
          ! test -e frontend/config.js
          ! test -e scripts/write_frontend_config.py
          grep -q 'IRON_PIT_BROWSER_ENGINE' frontend/browser-execution.js
          grep -q 'runEncounter' frontend/browser-execution.js
          grep -q 'IRON_PIT_BROWSER_AUDIT' frontend/browser-execution.js
          grep -q 'IRON_PIT_BATTLE_LAB' frontend/browser-execution.js
          grep -q 'crypto.getRandomValues' frontend/browser-dice.js

      - name: Prove production entry points are wired
        run: |
          test -s index.html
          grep -q '<base href="./frontend/">' index.html
          for page in index.html frontend/index.html; do
            grep -q 'id="hero-slots"' "$page"
            grep -q 'id="monster-slots"' "$page"
            grep -q 'id="fight-button"' "$page"
            grep -q 'id="step-fight-button"' "$page"
            grep -q 'id="quick-test"' "$page"
            grep -q 'browser-execution.js' "$page"
            grep -q 'battle-actions.js' "$page"
            grep -q 'browser-catalog.js' "$page"
            grep -q 'browser-monsters-generated.js' "$page"
            grep -q 'https://www.buymeacoffee.com/divclass016' "$page"
            ! grep -qi 'http-equiv="refresh"' "$page"
          done
          grep -q 'auditDetails' frontend/battlefield-view.js
          grep -q 'IRON_PIT_EXECUTION' frontend/app.js

      - name: Validate Netlify production-only credit guard
        run: |
          grep -q 'CONTEXT.*production' netlify.toml
          grep -q 'pip install -e ./backend' netlify.toml
          grep -q 'prepare_static_site.py' netlify.toml
