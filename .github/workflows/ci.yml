name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

# Exact-head certification for RAW combat, source parity, figure identity, full SRD roster visibility, six-slot UI, and Pages root entry.
jobs:
  combat-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python rules reference
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce production source limits
        run: python scripts/check_source_limits.py
      - name: Enforce declarative monster source of truth
        run: |
          python scripts/export_runtime_monster_capabilities.py --check
          ! grep -Eq 'app\.content\.(legacy_monster_roster|monster_|monsters_)' backend/app/content/roster.py
      - name: Verify durable certification manifests
        run: |
          python scripts/verify_certification_manifests.py
          python scripts/report_certification_progress.py
      - name: Report zero-engine monster candidates
        run: python scripts/report_zero_engine_monsters.py
      - name: Report capability blocker yields
        run: python scripts/report_capability_yield.py
      - name: Prepare static browser package
        run: |
          python scripts/prepare_static_site.py
          test -s frontend/data/srd_5_2_1_monsters.json
          test -s frontend/browser-monsters-generated.js
      - name: Upload canonical static artifacts
        uses: actions/upload-artifact@v4
        with:
          name: canonical-static-${{ github.sha }}
          path: |
            frontend/browser-monsters-generated.js
            frontend/data/srd_5_2_1_monsters.json
          retention-days: 1
      - name: Enforce generated static parity
        run: |
          git diff --exit-code -- frontend/browser-heroes.js frontend/figure-profiles.js frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json
          test -z "$(git status --porcelain --untracked-files=all -- frontend/browser-monsters-generated.js frontend/data/srd_5_2_1_monsters.json)"
      - name: Certify Python rules reference
        working-directory: backend
        run: pytest -q
      - name: Validate browser JavaScript syntax
        run: |
          for file in frontend/*.js; do node --check "$file"; done
      - name: Run deterministic browser combat regressions
        run: |
          node frontend/browser-engine.test.cjs
          node frontend/browser-formation.test.cjs
          node frontend/browser-conditional-damage.test.cjs
          node frontend/browser-swarm.test.cjs
          node frontend/browser-rage.test.cjs
          node frontend/browser-champion.test.cjs
          node frontend/browser-fighter4.test.cjs
          node frontend/browser-fighter5.test.cjs
          node frontend/browser-beast2.test.cjs
          node frontend/browser-batch3.test.cjs
          node frontend/browser-deathmatch.test.cjs
          node frontend/browser-zero-hp-lifecycle.test.cjs
          node frontend/browser-control.test.cjs
          node frontend/browser-poison.test.cjs
          node frontend/browser-mixed-damage.test.cjs
          node frontend/browser-venom.test.cjs
          node frontend/browser-mixed-multiattack.test.cjs
          node frontend/browser-expansion.test.cjs
          node frontend/browser-generated-monsters.test.cjs
          node frontend/browser-monster-saves.test.cjs
          node frontend/browser-condition-immunity.test.cjs
          node frontend/browser-action-healing.test.cjs
          node frontend/browser-action-condition.test.cjs
          node frontend/browser-reactions.test.cjs
          node frontend/browser-reaction-movement.test.cjs
          node frontend/browser-spell-area.test.cjs
          node frontend/browser-spell-policy.test.cjs
          node frontend/browser-precombat-spells.test.cjs
          node frontend/battle-log-format.test.cjs
          node frontend/figure-visuals.test.cjs
          node frontend/figure-portraits.test.cjs
          node frontend/encounter-picker.test.cjs
          node frontend/encounter-wiring.test.cjs
      - name: Prove production fight path is backend-free
        run: |
          ! grep -R -q 'IRON_PIT_API_BASE' frontend scripts
          ! grep -q '/api/' frontend/app.js
          ! test -e render.yaml
          ! test -e frontend/config.js
          ! test -e scripts/write_frontend_config.py
          grep -q 'IRON_PIT_BROWSER_ENGINE.runEncounter' frontend/app.js
          grep -q 'IRON_PIT_CANONICAL_MONSTERS_READY' frontend/app.js
      - name: Prove clean GitHub Pages root entry
        run: |
          test -s index.html
          grep -q '<base href="./frontend/">' index.html
          grep -q 'id="hero-slots"' index.html
          grep -q 'id="monster-slots"' index.html
          grep -q 'id="fight-button"' index.html
          ! grep -q 'id="distance"' index.html
          grep -q 'figure-archetypes.css' index.html
          grep -q 'figure-swarms.css' index.html
          grep -q 'figure-portraits.css' index.html
          grep -q 'figure-profiles.js' index.html
          grep -q 'figure-portraits.js' index.html
          grep -q 'browser-monsters-generated.js' index.html
          grep -q 'browser-monsters-expansion.js' index.html
          grep -q 'browser-condition-rules.js' index.html
          grep -q 'browser-action-economy.js' index.html
          grep -q 'browser-reactions.js' index.html
          grep -q 'browser-reaction-movement.js' index.html
          grep -q 'browser-champion.js' index.html
          grep -q 'browser-tactical-shift.js' index.html
          grep -q 'browser-healing.js' index.html
          grep -q 'browser-spell-area.js' index.html
          grep -q 'browser-spell-policy.js' index.html
          grep -q 'browser-spell-resolution.js' index.html
          grep -q 'browser-precombat-spells.js' index.html
          grep -q 'battlefield-picker.js' index.html
          grep -q 'battlefield-replay.js' index.html
          grep -q 'https://www.buymeacoffee.com/divclass016' index.html
          ! grep -qi 'http-equiv="refresh"' index.html
      - name: Prove live battlefield is wired
        run: |
          grep -q 'id="hero-slots"' frontend/index.html
          grep -q 'id="monster-slots"' frontend/index.html
          grep -q 'id="card-picker"' frontend/index.html
          grep -q 'id="combat-fx-overlay"' frontend/index.html
          ! grep -q 'id="distance"' frontend/index.html
          grep -q 'battlefield.css' frontend/index.html
          grep -q 'figure-archetypes.css' frontend/index.html
          grep -q 'figure-swarms.css' frontend/index.html
          grep -q 'figure-portraits.css' frontend/index.html
          grep -q 'figure-profiles.js' frontend/index.html
          grep -q 'figure-portraits.js' frontend/index.html
          grep -q 'browser-monsters-generated.js' frontend/index.html
          grep -q 'browser-monsters-expansion.js' frontend/index.html
          grep -q 'battle-log-format.js' frontend/index.html
          grep -q 'battlefield-picker.js' frontend/index.html
          grep -q 'battlefield-view.js' frontend/index.html
          grep -q 'battlefield-replay.js' frontend/index.html
          grep -q 'browser-condition-immunity.js' frontend/index.html
          grep -q 'browser-condition-rules.js' frontend/index.html
          grep -q 'browser-action-economy.js' frontend/index.html
          grep -q 'browser-reactions.js' frontend/index.html
          grep -q 'browser-reaction-movement.js' frontend/index.html
          grep -q 'browser-grapple.js' frontend/index.html
          grep -q 'browser-champion.js' frontend/index.html
          grep -q 'browser-tactical-shift.js' frontend/index.html
          grep -q 'browser-timed-conditions.js' frontend/index.html
          grep -q 'browser-saves.js' frontend/index.html
          grep -q 'browser-multiattack.js' frontend/index.html
          grep -q 'browser-healing.js' frontend/index.html
          grep -q 'browser-spell-area.js' frontend/index.html
          grep -q 'browser-spell-policy.js' frontend/index.html
          grep -q 'browser-spell-resolution.js' frontend/index.html
          grep -q 'browser-precombat-spells.js' frontend/index.html
          grep -q 'figure-visuals.js' frontend/index.html
          grep -q 'playIronPitBattle' frontend/app.js
          grep -q 'https://www.buymeacoffee.com/divclass016' frontend/index.html
      - name: Validate Netlify production-only credit guard
        run: |
          grep -q 'CONTEXT.*production' netlify.toml
          grep -q 'pip install -e ./backend' netlify.toml
          grep -q 'prepare_static_site.py' netlify.toml
