name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce production source limits
        run: python scripts/check_source_limits.py
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Validate frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/encounter-view.js
          node --check frontend/combat-effects.js
          node --check frontend/preview-data.js
          node --check frontend/preview-dice.js
          node --check frontend/preview-engine.js
          node --check frontend/arena-view.js
          node --check frontend/arena-animations.js
      - name: Validate production API fallback config
        run: |
          unset IRON_PIT_API_BASE
          python scripts/write_frontend_config.py
          grep -q 'https://iron-pit-d20-api.onrender.com' frontend/config.js
      - name: Validate deploy API override config
        env:
          IRON_PIT_API_BASE: https://example.com
        run: |
          python scripts/write_frontend_config.py
          grep -q 'https://example.com' frontend/config.js
      - name: Validate production wiring guards
        run: |
          grep -q 'CONTEXT.*production' netlify.toml
          grep -q 'workflow_run' .github/workflows/publish-pages.yml
          grep -q 'head_branch == '\''main'\''' .github/workflows/publish-pages.yml
      - name: Inspect current Netlify production config
        if: github.ref == 'refs/heads/fix/production-api-wiring'
        run: |
          echo '--- Netlify root status ---'
          curl --silent --show-error --fail --location --max-time 30 --write-out '\nHTTP %{http_code}\n' https://ironpit.netlify.app/ | head -c 2000
          echo
          echo '--- Netlify config.js ---'
          curl --silent --show-error --fail --location --max-time 30 https://ironpit.netlify.app/config.js | tee /tmp/netlify-config.js
          echo
          api_base="$(sed -n 's/.*IRON_PIT_API_BASE = "\(https:[^"]*\)".*/\1/p' /tmp/netlify-config.js)"
          echo "Recovered Netlify API base: ${api_base:-<blank>}"
      - name: Validate production Render health endpoint
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/production-api-wiring'
        run: |
          body="$(curl --silent --show-error --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 60 https://iron-pit-d20-api.onrender.com/health)"
          printf '%s' "$body" | grep -q '"status":"ok"'
      - name: Build API Docker image
        run: docker build -t iron-pit-d20-api ./backend
