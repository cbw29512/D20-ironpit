name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Validate Netlify frontend config generation
        env:
          IRON_PIT_API_BASE: https://example.com
        run: |
          python scripts/write_frontend_config.py
          grep -q 'https://example.com' frontend/config.js
      - name: Build API Docker image
        run: docker build -t iron-pit-d20-api ./backend
