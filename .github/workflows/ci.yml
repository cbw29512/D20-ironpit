name: CI

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: backend
        run: pip install -e '.[dev]'
      - name: Enforce production source limits
        run: python scripts/check_source_limits.py
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Validate rules coverage sync
        run: python scripts/check_rules_sync.py
      - name: Validate frontend JavaScript syntax
        run: |
          node --check frontend/app.js
          node --check frontend/preview-data.js
          node --check frontend/preview-dice.js
          node --check frontend/preview-effects.js
          node --check frontend/preview-tactics.js
          node --check frontend/preview-engine.js
          node --check frontend/preview-rogue.js
          node --check frontend/arena-animations.js
          node --check frontend/effects-view.js
          node --check frontend/arena-view.js
          node --check frontend/rules-view.js
      - name: Validate preview combat effects
        run: node scripts/check_preview_effects.js
      - name: Validate combat-card effects
        run: node scripts/check_card_effects.js
      - name: Validate preview combat tactics
        run: node scripts/check_preview_tactics.js
      - name: Validate controlled arena modes
        run: node scripts/check_preview_modes.js
      - name: Validate Rogue ambush preview
        run: node scripts/check_preview_rogue.js
      - name: Validate Netlify static preview config
        run: |
          unset IRON_PIT_API_BASE
          python scripts/write_frontend_config.py
          grep -q 'IRON_PIT_API_BASE = ""' frontend/config.js
      - name: Validate Netlify live API config
        env:
          IRON_PIT_API_BASE: https://example.com
        run: |
          python scripts/write_frontend_config.py
          grep -q 'https://example.com' frontend/config.js
      - name: Build API Docker image
        run: docker build -t iron-pit-d20-api ./backend
