services:
  - type: web
    name: iron-pit-d20-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://cbw29512.github.io,https://ironpit.netlify.app"
      - key: LOG_LEVEL
        value: INFO
