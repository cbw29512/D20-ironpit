<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Iron Pit — MVP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SRD 5.2.1 COMBAT PROTOTYPE</p>
      <h1>The Iron Pit</h1>
      <p>Rules-first character vs. monster combat</p>
    </header>

    <section class="arena" aria-label="Battle arena">
      <article class="combatant">
        <h2 id="fighter-name">Aldric Vane</h2>
        <p id="fighter-meta">Fighter 1 · Longsword + Shield · Chain Mail</p>
        <div class="hp"><span id="fighter-hp-bar"></span></div>
        <strong id="fighter-hp">12 / 12 HP</strong>
        <svg id="fighter" class="stick" viewBox="0 0 180 220" role="img" aria-label="Stick fighter with sword and shield">
          <circle cx="90" cy="42" r="22"/><line x1="90" y1="64" x2="90" y2="132"/>
          <line x1="90" y1="82" x2="52" y2="112"/><line x1="90" y1="82" x2="128" y2="108"/>
          <line x1="90" y1="132" x2="60" y2="188"/><line x1="90" y1="132" x2="122" y2="188"/>
          <g class="weapon"><line x1="128" y1="108" x2="156" y2="64"/><line x1="148" y1="66" x2="166" y2="78"/></g>
          <circle class="shield" cx="47" cy="113" r="22"/>
        </svg>
      </article>

      <div class="versus">⚔</div>

      <article class="combatant">
        <h2 id="goblin-name">Goblin Warrior</h2>
        <p id="goblin-meta">CR 1/4 · Scimitar + Shield · Leather</p>
        <div class="hp"><span id="goblin-hp-bar"></span></div>
        <strong id="goblin-hp">10 / 10 HP</strong>
        <svg id="goblin" class="stick goblin" viewBox="0 0 180 220" role="img" aria-label="Stick goblin with scimitar and shield">
          <circle cx="90" cy="58" r="19"/><path class="ear" d="M72 55 L48 45 L70 68 M108 55 L132 45 L110 68"/>
          <line x1="90" y1="77" x2="90" y2="136"/><line x1="90" y1="92" x2="52" y2="116"/><line x1="90" y1="92" x2="128" y2="112"/>
          <line x1="90" y1="136" x2="61" y2="184"/><line x1="90" y1="136" x2="120" y2="184"/>
          <g class="weapon"><path d="M128 112 Q153 88 160 62"/><line x1="151" y1="70" x2="165" y2="78"/></g>
          <circle class="shield" cx="48" cy="117" r="19"/>
        </svg>
      </article>
    </section>

    <section class="controls">
      <button id="fight-button" type="button">Enter the Pit</button>
      <p id="status" aria-live="polite">Loading roster...</p>
    </section>

    <section class="log-panel">
      <h2>Battle Log</h2>
      <ol id="battle-log"></ol>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
