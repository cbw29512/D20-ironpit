description = "Rules-first gladiator combat engine MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
